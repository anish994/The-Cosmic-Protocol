<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Ecosystem: The Fractured Cosmogram</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-gold: #ffd700;
            --neon-red: #ff003c;
            --glass-bg: rgba(10, 10, 15, 0.85);
            --glass-border: 1px solid rgba(255, 255, 255, 0.15);
            --font-main: 'Segoe UI', sans-serif;
            --font-header: 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #050505;
            color: #eee;
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- MAP CONTAINER & LAYERS --- */
        #map-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        .layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        #bg-cosmogram {
            background: url('map_assets/cosmogram-bg.png') no-repeat center center;
            background-size: cover;
            opacity: 0.6;
            animation: slowRotate 120s linear infinite;
            z-index: 0;
        }

        #bg-video-pulse {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            z-index: 1;
            opacity: 0.8;
            mix-blend-mode: screen;
        }

        #bg-fog-overlay {
            object-fit: cover;
            opacity: 0.3;
            mix-blend-mode: overlay;
            z-index: 2;
        }

        /* --- CONNECTION LINES (SVG) --- */
        #connections-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }
        .connection-line {
            stroke: var(--neon-cyan);
            stroke-width: 1.5;
            stroke-dasharray: 5, 5;
            opacity: 0.4;
            animation: dashFlow 20s linear infinite;
        }
        .connection-line.danger { stroke: var(--neon-red); }
        .connection-line.mythic { stroke: var(--neon-gold); }

        /* --- INTERACTIVE NODES --- */
        #nodes-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Allow clicks to pass through empty space */
        }

        .map-node {
            position: absolute;
            width: 140px;
            height: 140px;
            transform: translate(-50%, -50%);
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .map-node:hover {
            transform: translate(-50%, -50%) scale(1.15);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px var(--neon-cyan);
            z-index: 20;
        }

        .map-node.nexus {
            width: 180px; height: 180px;
            border-color: var(--neon-gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            left: 50%; top: 50%;
        }
        .map-node.nexus:hover {
             box-shadow: 0 0 50px var(--neon-gold);
        }

        .node-bg {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            opacity: 0.6;
            background-size: cover;
            background-position: center;
            transition: opacity 0.3s;
        }
        .map-node:hover .node-bg { opacity: 0.9; }

        .node-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 10px;
        }

        .node-title {
            font-family: var(--font-header);
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px #000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .node-subtitle {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            margin-top: 4px;
        }

        /* --- MODAL (Glass & Glyph) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; }

        .region-modal {
            width: 90%;
            max-width: 1000px;
            height: 85%;
            background: rgba(15, 15, 20, 0.95);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: modalSlideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(90deg, rgba(0,243,255,0.1), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: var(--font-header);
            font-size: 2rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .close-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 8px 16px;
            cursor: pointer;
            font-family: var(--font-header);
            transition: all 0.2s;
        }
        .close-btn:hover { background: var(--neon-red); border-color: var(--neon-red); }

        .modal-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .modal-nav {
            width: 250px;
            border-right: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .tab-btn {
            padding: 15px 20px;
            background: transparent;
            border: none;
            border-left: 3px solid transparent;
            color: #aaa;
            text-align: left;
            cursor: pointer;
            font-family: var(--font-header);
            transition: all 0.2s;
        }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active {
            color: var(--neon-cyan);
            border-left-color: var(--neon-cyan);
            background: linear-gradient(90deg, rgba(0,243,255,0.1), transparent);
        }

        .tab-content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-pane.active { display: block; }

        /* Content Styling */
        h3 { color: var(--neon-gold); margin-bottom: 15px; font-family: var(--font-header); border-bottom: 1px solid rgba(255,215,0,0.3); padding-bottom: 5px; display: inline-block; }
        p { margin-bottom: 15px; line-height: 1.6; color: #ddd; }
        .tag { display: inline-block; padding: 4px 8px; background: rgba(255,255,255,0.1); border-radius: 4px; font-size: 0.8rem; margin-right: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.2); }
        .tag.danger { border-color: var(--neon-red); color: var(--neon-red); background: rgba(255,0,60,0.1); }
        .tag.mythic { border-color: var(--neon-gold); color: var(--neon-gold); background: rgba(255,215,0,0.1); }

        .story-node {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        .story-node:hover { border-color: var(--neon-cyan); }

        /* Keyframe Animations */
        @keyframes slowRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes dashFlow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
        @keyframes modalSlideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div id="map-container">
        <!-- Layer 0: Rotating Cosmogram -->
        <div id="bg-cosmogram" class="layer"></div>

        <!-- Layer 1: Nexus Pulse Video (Center) -->
        <video id="bg-video-pulse" class="layer" autoplay muted loop playsinline>
            <source src="map_assets/nexus-pulse.mp4" type="video/mp4">
        </video>

        <!-- Layer 2: Fog Overlay -->
        <video id="bg-fog-overlay" class="layer" autoplay muted loop playsinline>
            <source src="map_assets/resonance-fog.mp4" type="video/mp4">
        </video>

        <!-- Layer 3: SVG Connections -->
        <svg id="connections-svg"></svg>

        <!-- Layer 4: Interactive Nodes -->
        <div id="nodes-layer">
            <!-- Nodes will be injected by JS -->
        </div>
    </div>

    <!-- REGION MODAL -->
    <div class="modal-overlay" id="regionModal">
        <div class="region-modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">REGION NAME</h2>
                <button class="close-btn" onclick="closeModal()">CLOSE [ESC]</button>
            </div>
            <div class="modal-body">
                <div class="modal-nav">
                    <button class="tab-btn active" onclick="switchTab('overview')">ATMOSPHERE & LOGIC</button>
                    <button class="tab-btn" onclick="switchTab('subzones')">SUB-ZONES & NODES</button>
                    <button class="tab-btn" onclick="switchTab('secrets')">RESONANCE & SECRETS</button>
                </div>
                <div class="tab-content-area">
                    <div id="tab-overview" class="tab-pane active">
                        <!-- Dynamic Content -->
                    </div>
                    <div id="tab-subzones" class="tab-pane">
                        <!-- Dynamic Content -->
                    </div>
                    <div id="tab-secrets" class="tab-pane">
                        <!-- Dynamic Content -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA SOURCE (Based on regions.md) ---
        const regionsDB = {
            "nexus_gate": {
                name: "Nexus Gate",
                type: "nexus",
                subtitle: "Central Hub",
                bg: "map_assets/nexus-pulse.mp4", // Use video thumb or placeholder
                x: 50, y: 50, // Center
                desc: "The architect-forged constant. A compact, layered palace-hub suspended across all parallel timelines. Safe anchor for resurrection and synthesis.",
                resonance: ["Echoes", "Pulse"],
                danger: "Low",
                subzones: [
                    { name: "Arrival Platform", type: "Spawn Anchor", desc: "Normalize player state; first CPS imprint." },
                    { name: "Resonance Relay Core", type: "System", desc: "Adjust travel latency, skill cooldown shaping." },
                    { name: "Skill Infusion Alcoves", type: "Crafting", desc: "Craft incremental refinements; low-risk infusion loops." },
                    { name: "Traversal Gate Array", type: "Transport", desc: "Route to external regions; cost scaling based on karma." }
                ],
                secrets: "Surge Event: 'Cross-Reality Alignment' temporarily raises danger to Medium and unlocks hidden transfer paths."
            },
            "inverted_landmasses": {
                name: "Inverted Landmasses",
                type: "biome",
                subtitle: "Gravity Flux Zone",
                bg: "map_assets/inverted-landmasses.png",
                x: 50, y: 15, // Top
                desc: "A disorienting zone where gravity reverses and terrain shifts unpredictably. Home to Inverted Wraiths and lost physics.",
                resonance: ["Paradox", "Gravity"],
                danger: "Medium",
                subzones: [
                    { name: "Gravity Flux Event", type: "Hazard", desc: "Gravity reverses, terrain shifts unpredictably." },
                    { name: "Inverted Echo Ritual", type: "Social", desc: "Factions gather, resonance inverts, wisdom is shared." },
                    { name: "Upside-Down Relic Hunt", type: "Loot", desc: "Relic is guarded by inverted entities." }
                ],
                secrets: "High resonance stabilizes gravity flux. Low resonance intensifies chaos."
            },
            "resonant_bloom": {
                name: "Resonant Bloom",
                type: "biome",
                subtitle: "Harmonic Wilds",
                bg: "map_assets/resonant-bloom.png",
                x: 85, y: 50, // Right
                desc: "Vibrant, uplifting zones where luminous flora pulse and rare blooms appear. A place of transformation.",
                resonance: ["Growth", "Harmony"],
                danger: "Low-Medium",
                subzones: [
                    { name: "Bloom Surge Awakening", type: "Event", desc: "Luminous flora pulse, rare blooms appear." },
                    { name: "Pantheon Ritual", type: "Sacred", desc: "Ritual chambers glow, echo gates open." },
                    { name: "Pulse Garden Challenge", type: "Puzzle", desc: "Prismatic rivers shift, karma relics appear." }
                ],
                secrets: "Harvesting blooms mutates skills. Protection grants karma."
            },
            "corrupted_zones": {
                name: "Corrupted Zones",
                type: "biome",
                subtitle: "Fractured Reality",
                bg: "map_assets/corrupted-zone.png",
                x: 15, y: 50, // Left
                desc: "Oppressive, haunted regions where the altar pulses with corrupted energy. High risk, high reward.",
                resonance: ["Entropy", "Corruption"],
                danger: "High",
                subzones: [
                    { name: "The Altar Awakening", type: "Boss", desc: "The altar pulses with corrupted energy." },
                    { name: "Code Storm Crossing", type: "Hazard", desc: "The river floods with corrupted code." },
                    { name: "Forbidden Ritual", type: "Secret", desc: "Chamber filled with glitching sigils." }
                ],
                secrets: "Purification lowers corruption. Harnessing increases power but attracts elite enemies."
            },
            "cps_memory": {
                name: "CPS Memory Zones",
                type: "biome",
                subtitle: "Digital Archive",
                bg: "map_assets/cps-memory-zone.png",
                x: 50, y: 85, // Bottom
                desc: "Intense, revelatory zones where the core pulses with ancient Architect data. Digital ghosts roam here.",
                resonance: ["Data", "Memory"],
                danger: "High",
                subzones: [
                    { name: "Memory Core Activation", type: "System", desc: "Core pulses with ancient Architect data." },
                    { name: "Fragmented Archive", type: "Loot", desc: "Lost Architect memories surface." },
                    { name: "Data Storm Event", type: "Hazard", desc: "Data surges distort reality." }
                ],
                secrets: "High resonance reveals hidden data. Synchronization unlocks new skills."
            },
            "architect_graves": {
                name: "Architect Graves",
                type: "biome",
                subtitle: "Solemn Ruins",
                bg: "map_assets/cosmogram-bg.png", // Fallback or specific asset
                x: 25, y: 25, // Top-Left
                desc: "Solemn, mysterious tombs where ancient mechanisms activate. The resting place of the Builders.",
                resonance: ["Fate", "Echoes"],
                danger: "Low",
                subzones: [
                    { name: "Tomb Awakening", type: "Event", desc: "Tomb pulses, ancient mechanisms activate." },
                    { name: "Grave Echo Ritual", type: "Social", desc: "Factions gather, wisdom is shared." }
                ],
                secrets: "Deciphering runes grants skills. Confrontation yields rare artifacts."
            },
             "echo_fields": {
                name: "Echo Fields",
                type: "biome",
                subtitle: "Reverberant Plains",
                bg: "map_assets/resonance-fog.mp4", // Using fog video as placeholder/bg
                x: 75, y: 25, // Top-Right
                desc: "Haunting, reflective plains where echoes of past actions flood the zone. Time is fluid here.",
                resonance: ["Time", "Echoes"],
                danger: "Medium",
                subzones: [
                    { name: "Echo Bloom Event", type: "Event", desc: "Echo nodes pulse, memories replay." },
                    { name: "Recursion Loop", type: "Trap", desc: "Time and space repeat." }
                ],
                secrets: "High resonance calms storms. Time manipulation skills can break loops."
            },
            "neutral_silence": {
                name: "Neutral Silence",
                type: "biome",
                subtitle: "Stillfield Labyrinth",
                bg: "map_assets/cosmogram-bg.png",
                x: 75, y: 75, // Bottom-Right
                desc: "Tranquil, introspective labyrinths. Perfect neutrality opens new routes.",
                resonance: ["Silence", "Void"],
                danger: "Variable",
                subzones: [
                    { name: "Meditation Trial", type: "Challenge", desc: "Labyrinth shifts, echoing mantras." },
                    { name: "Sanctum Gateway", type: "Portal", desc: "Gateway sigils glow." }
                ],
                secrets: "Perfect neutrality opens hidden paths. Imbalance triggers echo storms."
            },
            "mythic_biomes": {
                name: "Mythic Biomes",
                type: "biome",
                subtitle: "Legendary Realms",
                bg: "map_assets/fusion-bg.mp4",
                x: 25, y: 75, // Bottom-Left
                desc: "Living archives of legend. Birthplace of divine fusions and cosmic creation.",
                resonance: ["Myth", "Legend"],
                danger: "Extreme",
                subzones: [
                    { name: "Pantheon Wilds", type: "Zone", desc: "Living archives of legend." },
                    { name: "Titan Gardens", type: "Boss", desc: "Home to mythborn titans." }
                ],
                secrets: "High mythic resonance unlocks rare legends and skill upgrades."
            }
        };

        // --- INITIALIZATION ---
        function initMap() {
            const container = document.getElementById('nodes-layer');
            const svg = document.getElementById('connections-svg');
            
            // Render Nodes
            for (const [key, data] of Object.entries(regionsDB)) {
                const node = document.createElement('div');
                node.className = `map-node ${data.type}`;
                node.style.left = `${data.x}%`;
                node.style.top = `${data.y}%`;
                node.onclick = () => openModal(key);

                // Background (Image or Video)
                const isVideo = data.bg.endsWith('.mp4');
                if(isVideo) {
                     const vid = document.createElement('video');
                     vid.src = data.bg;
                     vid.className = 'node-bg';
                     vid.autoplay = true;
                     vid.muted = true;
                     vid.loop = true;
                     vid.playsInline = true;
                     node.appendChild(vid);
                } else {
                    const img = document.createElement('div');
                    img.className = 'node-bg';
                    img.style.backgroundImage = `url('${data.bg}')`;
                    node.appendChild(img);
                }

                // Content
                const content = document.createElement('div');
                content.className = 'node-content';
                content.innerHTML = `
                    <div class="node-title">${data.name}</div>
                    <div class="node-subtitle">${data.subtitle}</div>
                `;
                node.appendChild(content);

                container.appendChild(node);
            }

            // Draw Connections (Simple Star Topology from Nexus)
            const nexus = regionsDB['nexus_gate'];
            for (const [key, data] of Object.entries(regionsDB)) {
                if (key !== 'nexus_gate') {
                    drawLine(svg, nexus.x, nexus.y, data.x, data.y, data.danger === 'High' ? 'danger' : '');
                }
            }
            // Extra connections (Ring)
            drawLine(svg, 25, 25, 50, 15, ''); // Graves -> Inverted
            drawLine(svg, 50, 15, 75, 25, ''); // Inverted -> Echo
            drawLine(svg, 75, 25, 85, 50, ''); // Echo -> Bloom
            drawLine(svg, 85, 50, 75, 75, ''); // Bloom -> Silence
            drawLine(svg, 75, 75, 50, 85, ''); // Silence -> CPS
            drawLine(svg, 50, 85, 25, 75, 'danger'); // CPS -> Mythic
            drawLine(svg, 25, 75, 15, 50, 'danger'); // Mythic -> Corrupted
            drawLine(svg, 15, 50, 25, 25, 'danger'); // Corrupted -> Graves
        }

        function drawLine(svg, x1, y1, x2, y2, type) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1 + '%');
            line.setAttribute('y1', y1 + '%');
            line.setAttribute('x2', x2 + '%');
            line.setAttribute('y2', y2 + '%');
            line.setAttribute('class', `connection-line ${type}`);
            svg.appendChild(line);
        }

        // --- MODAL LOGIC ---
        function openModal(regionKey) {
            const data = regionsDB[regionKey];
            const modal = document.getElementById('regionModal');
            
            document.getElementById('modalTitle').innerText = data.name;

            // Populate Overview
            const overview = document.getElementById('tab-overview');
            overview.innerHTML = `
                <h3>Atmosphere & Logic</h3>
                <p>${data.desc}</p>
                <div class="tags">
                    <span class="tag">TYPE: ${data.type.toUpperCase()}</span>
                    <span class="tag ${data.danger === 'High' || data.danger === 'Extreme' ? 'danger' : ''}">DANGER: ${data.danger.toUpperCase()}</span>
                    ${data.resonance.map(r => `<span class="tag mythic">${r.toUpperCase()}</span>`).join('')}
                </div>
            `;

            // Populate Subzones
            const subzones = document.getElementById('tab-subzones');
            subzones.innerHTML = `<h3>Sub-Zones & Story Nodes</h3>`;
            data.subzones.forEach(sz => {
                subzones.innerHTML += `
                    <div class="story-node">
                        <strong>${sz.name}</strong> <span class="tag">${sz.type}</span>
                        <p>${sz.desc}</p>
                    </div>
                `;
            });

            // Populate Secrets
            const secrets = document.getElementById('tab-secrets');
            secrets.innerHTML = `
                <h3>Resonance & Secrets</h3>
                <div class="story-node">
                    <p>${data.secrets}</p>
                </div>
            `;

            // Reset tabs
            switchTab('overview');
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('regionModal').classList.remove('active');
        }

        function switchTab(tabName) {
            // Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            // Since I used specific onclicks, I need to find the right button. 
            // A cleaner way is just matching index or text, but let's simple-match:
            const buttons = document.querySelectorAll('.tab-btn');
            if(tabName === 'overview') buttons[0].classList.add('active');
            if(tabName === 'subzones') buttons[1].classList.add('active');
            if(tabName === 'secrets') buttons[2].classList.add('active');

            // Panes
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // Keyboard close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Run
        window.onload = initMap;

    </script>
</body>
</html>
