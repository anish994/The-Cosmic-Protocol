<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animation Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Animation Gallery</h1>
    <div class="controls">
      <label>
        Category
        <select id="filter-category">
          <option value="all">All</option>
          <option value="characters">Characters</option>
          <option value="general">General</option>
        </select>
      </label>
      <label>
        Character
        <select id="filter-group" disabled>
          <option value="all">All</option>
        </select>
      </label>
      <label class="grow">
        Search
        <input id="filter-search" type="text" placeholder="Find animation..." />
      </label>
      <label class="toggle">
        <input id="opt-hoverplay" type="checkbox" checked /> Hover play
      </label>
      <span id="count" class="count"></span>
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <script src="gallery_manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
