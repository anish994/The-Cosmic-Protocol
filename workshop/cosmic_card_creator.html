
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cosmic Card Creator - Jotysh Engine</title>
    <style>
        :root {
            --bg-dark: #050508;
            --panel-bg: #0f0f16;
            --panel-border: #1f1f2e;
            --accent: #6d28d9;
            --accent-glow: #8b5cf6;
            --text-main: #e2e8f0;
            --text-dim: #64748b;
            --void: #312e81;
            --solar: #b45309;
            --nature: #064e3b;
            --success: #10b981;
            --legendary-grad: linear-gradient(135deg, #f59e0b 0%, #b91c1c 100%);
            --rare-grad: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --common-grad: linear-gradient(135deg, #475569 0%, #1e293b 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* === MOBILE LANDSCAPE LOCK === */
        @media (orientation: portrait) {
            body::before {
                content: '📱 Please rotate your device to landscape mode';
                position: fixed;
                inset: 0;
                background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: clamp(1rem, 4vw, 1.4rem);
                text-align: center;
                padding: 2rem;
                font-weight: 600;
                color: #fff;
                animation: rotatePrompt 2s ease-in-out infinite;
            }
            
            body::after {
                content: '🔄';
                position: fixed;
                top: 35%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: clamp(3rem, 10vw, 5rem);
                z-index: 10000;
                animation: rotateIcon 1.5s ease-in-out infinite;
            }
            
            .cosmic-workspace {
                display: none !important;
            }
        }

        @keyframes rotatePrompt {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        @keyframes rotateIcon {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -50%) rotate(90deg); }
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            touch-action: pan-x pan-y;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile */
            width: 100vw;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
            position: fixed;
        }
        
        /* === MAIN WORKSPACE LAYOUT === */
        .cosmic-workspace {
            display: grid;
            grid-template-columns: minmax(200px, 280px) 1fr minmax(220px, 300px);
            grid-template-rows: 100%;
            gap: 1px;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background: var(--panel-border);
        }
        
        /* === RESPONSIVE BREAKPOINTS === */
        /* Large Landscape (Desktop) */
        @media (min-width: 1400px) and (orientation: landscape) {
            .cosmic-workspace {
                grid-template-columns: 320px 1fr 380px;
            }
        }
        
        /* Standard Landscape (Tablets) */
        @media (min-width: 1024px) and (max-width: 1399px) and (orientation: landscape) {
            .cosmic-workspace {
                grid-template-columns: 280px 1fr 340px;
            }
        }
        
        /* Small Landscape (Mobile) */
        @media (max-width: 1023px) and (orientation: landscape) {
            .cosmic-workspace {
                grid-template-columns: 200px 1fr 240px;
            }
        }
        
        /* Tiny Landscape (Small Mobile) */
        @media (max-width: 767px) and (orientation: landscape) {
            .cosmic-workspace {
                grid-template-columns: 180px 1fr 200px;
            }
        }
        
        /* === PANEL BASE STYLES === */
        .cosmic-panel {
            background: var(--panel-bg);
            border: none;
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* === PANEL HEADERS === */
        .panel-header {
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.2) 100%);
            border-bottom: 1px solid var(--panel-border);
            padding: 1rem 1.2rem;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            position: relative;
        }

        .panel-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            opacity: 0.3;
        }
        
        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(139,92,246,0.3);
        }
        
        .panel-icon {
            font-size: 1.1rem;
            filter: drop-shadow(0 0 4px rgba(139,92,246,0.4));
        }
        
        .panel-actions {
            display: flex;
            gap: 6px;
        }
        
        /* === PANEL CONTENT AREAS === */
        .panel-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.5rem;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            position: relative;
        }
        
        /* Custom Scrollbar */
        .panel-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .panel-content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        
        .panel-content::-webkit-scrollbar-thumb {
            background: rgba(139,92,246,0.3);
            border-radius: 3px;
        }
        
        .panel-content::-webkit-scrollbar-thumb:hover {
            background: rgba(139,92,246,0.5);
        }
        
        /* === PLACEHOLDER TEXT === */
        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255,255,255,0.3);
            font-size: clamp(12px, 2vh, 16px);
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
        
        /* === ACTION BUTTONS === */
        .cosmic-btn {
            padding: 0.4rem 0.8rem;
            background: rgba(139,92,246,0.1);
            color: var(--accent-glow);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }
        
        .cosmic-btn:hover {
            background: rgba(139,92,246,0.2);
            border-color: rgba(139,92,246,0.5);
            transform: translateY(-1px);
        }
        
        .cosmic-btn:active {
            transform: translateY(0);
        }
        
        .cosmic-btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent-glow);
        }
        
        .cosmic-btn.primary:hover {
            background: var(--accent-glow);
            box-shadow: 0 0 20px rgba(139,92,246,0.3);
        }
        
        /* === LEFT PANEL SPECIFIC === */
        #left-panel {
            grid-column: 1;
        }

        #left-panel .panel-header {
            background: linear-gradient(180deg, rgba(139,92,246,0.15) 0%, rgba(0,0,0,0.3) 100%);
        }

        .collection-stats {
            display: flex;
            gap: 0.8rem;
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--panel-border);
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.6rem;
            background: rgba(139,92,246,0.1);
            border: 1px solid rgba(139,92,246,0.2);
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .stat-badge:hover {
            background: rgba(139,92,246,0.15);
            border-color: rgba(139,92,246,0.3);
        }

        .stat-value {
            color: var(--accent-glow);
            font-weight: 700;
        }
        
        /* === CENTER PANEL SPECIFIC === */
        #center-panel {
            grid-column: 2;
        }
        
        /* === RIGHT PANEL SPECIFIC === */
        #right-panel {
            grid-column: 3;
        }
        
        /* === LOADING ANIMATION === */
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        
        .loading {
            animation: pulse 2s ease-in-out infinite;
        }

        /* === SKILL CARD ANIMATIONS === */
        @keyframes skillAppear {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes legendaryGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.15); }
            50% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.25); }
        }

        @keyframes rareGlow {
            0%, 100% { box-shadow: 0 0 4px rgba(59, 130, 246, 0.15); }
            50% { box-shadow: 0 0 6px rgba(59, 130, 246, 0.25); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 0.15; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        .skill-card {
            animation: skillAppear 0.5s cubic-bezier(0.2, 0, 0.1, 1) backwards;
            position: relative;
            overflow: hidden;
        }

        .skill-card.legendary {
            animation: skillAppear 0.5s cubic-bezier(0.2, 0, 0.1, 1) backwards, legendaryGlow 6s ease-in-out infinite;
        }

        .skill-card.rare {
            animation: skillAppear 0.5s cubic-bezier(0.2, 0, 0.1, 1) backwards, rareGlow 8s ease-in-out infinite;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,92,246,0.3), transparent);
            animation: scanline 12s linear infinite;
        }

        /* Premium Skill Card Enhancements */
        .skill-card-inner {
            position: relative;
            z-index: 1;
        }

        .skill-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.6rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .skill-card-title {
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }

        .skill-card-icon {
            font-size: 1.8rem;
            opacity: 0.7;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            transition: all 0.3s ease;
        }

        .skill-card:hover .skill-card-icon {
            opacity: 1;
            transform: scale(1.1) rotate(5deg);
        }

        .skill-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .skill-tag {
            background: rgba(139,92,246,0.15);
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-size: 0.65rem;
            color: var(--accent-glow);
            border: 1px solid rgba(139,92,246,0.2);
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
        }

        .skill-tag:hover {
            background: rgba(139,92,246,0.25);
            border-color: rgba(139,92,246,0.4);
        }

        .skill-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-top: 0.6rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .fused-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.5rem;
            background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(5,150,105,0.2));
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 3px;
            color: var(--success);
            font-weight: 700;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
        }

        /* === PARTICLE EFFECTS === */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particleFloat 10s ease-in-out infinite;
            opacity: 0.15;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-15px) translateX(8px); }
        }

        /* === MASTERY PROGRESS === */
        .mastery-bar {
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.6rem;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }

        .mastery-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #10b981);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px rgba(139,92,246,0.6);
            position: relative;
        }

        .mastery-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent);
        }

        /* === NOTIFICATION SYSTEM === */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15,15,22,0.98);
            border: 1px solid rgba(139,92,246,0.4);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            z-index: 1000;
            animation: slideIn 0.4s cubic-bezier(0.2, 0, 0.1, 1), slideOut 0.4s cubic-bezier(0.2, 0, 0.1, 1) 2.6s forwards;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 10px rgba(139,92,246,0.15);
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(400px); opacity: 0; }
        }

        /* === AMBIENT OVERLAY === */
        .ambient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, rgba(139,92,246,0.03) 0%, transparent 50%);
            animation: ambientPulse 15s ease-in-out infinite;
        }

        @keyframes ambientPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- Ambient Overlay -->
    <div class="ambient-overlay"></div>

    <!-- Particle Container -->
    <div class="particle-container" id="particle-container"></div>

    <div class="cosmic-workspace">
        
        <!-- LEFT PANEL: Neural Archive / Skill Library -->
        <div class="cosmic-panel" id="left-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span class="panel-icon">📚</span>
                    <span>Neural Archive</span>
                </div>
                <div class="panel-actions">
                    <button class="cosmic-btn" title="Refresh skills">🔄</button>
                </div>
            </div>
            <div class="panel-content">
                <div class="placeholder" style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-dim); font-size:0.85rem;">
                    Loading Neural Archive...
                </div>
            </div>
        </div>

        <!-- CENTER PANEL: Jotysh Engine / 12-House Chart -->
        <div class="cosmic-panel" id="center-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span class="panel-icon">🌟</span>
                    <span>Jotysh Engine</span>
                </div>
                <div class="panel-actions">
                    <button class="cosmic-btn primary" title="Invoke card">🎴 Invoke</button>
                    <button class="cosmic-btn" title="Reset">🔄</button>
                </div>
            </div>
            <div class="panel-content">
                <div class="placeholder">
                    12-House Vedic Chart will appear here...
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Card Preview / Stats -->
        <div class="cosmic-panel" id="right-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span class="panel-icon">📊</span>
                    <span>Card Preview</span>
                </div>
                <div class="panel-actions">
                    <button class="cosmic-btn" title="Save card">💾</button>
                </div>
            </div>
            <div class="panel-content">
                <div class="placeholder">
                    Card stats will appear here...
                </div>
            </div>
        </div>

    </div>

    <script>
        // === AUDIO SYSTEM ===
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let ambientSound = null;

        function playSound(type, frequency = 440, duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'hover') {
                osc.frequency.value = 600;
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.start(now);
                osc.stop(now + 0.04);
            } else if (type === 'click') {
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'select') {
                osc.frequency.value = 1000;
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'achievement') {
                // Two-tone success sound
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function startAmbientSound() {
            if (!ambientSound) {
                // Subtle background hum
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 60; // Deep hum
                gain.gain.value = 0.008; // Extremely subtle
                osc.start();
                ambientSound = { osc, gain };
            }
        }

        // === PARTICLE SYSTEM ===
        function createParticles() {
            const container = document.getElementById('particle-container');
            const particleCount = 8;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = `${Math.random() * 2 + 1}px`;
                particle.style.height = particle.style.width;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.background = `rgba(139, 92, 246, ${Math.random() * 0.3 + 0.1})`;
                particle.style.animationDelay = `${Math.random() * 10}s`;
                particle.style.animationDuration = `${Math.random() * 6 + 8}s`;
                container.appendChild(particle);
            }
        }

        // === NOTIFICATION SYSTEM ===
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `
                <div style="display:flex; align-items:center; gap:0.8rem;">
                    <span style="font-size:1.5rem;">${type === 'achievement' ? '🏆' : 'ℹ️'}</span>
                    <div>
                        <div style="font-weight:600; margin-bottom:0.2rem;">${message}</div>
                        <div style="font-size:0.7rem; color:var(--text-dim);">${new Date().toLocaleTimeString()}</div>
                    </div>
                </div>
            `;
            document.body.appendChild(notification);
            playSound(type === 'achievement' ? 'achievement' : 'click');
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // === ACHIEVEMENT SYSTEM ===
        let achievements = JSON.parse(localStorage.getItem('cosmic_achievements') || '[]');
        
        function unlockAchievement(id, name, description) {
            if (!achievements.includes(id)) {
                achievements.push(id);
                localStorage.setItem('cosmic_achievements', JSON.stringify(achievements));
                showNotification(`Achievement Unlocked: ${name}`, 'achievement');
                createSparkEffect();
            }
        }

        function checkAchievements() {
            if (ownedSkills.length >= 1 && !achievements.includes('first_skill')) {
                unlockAchievement('first_skill', 'First Steps', 'Acquired your first skill');
            }
            if (ownedSkills.length >= 5 && !achievements.includes('collector')) {
                unlockAchievement('collector', 'Skill Collector', 'Acquired 5 skills');
            }
            if (ownedSkills.length >= 10 && !achievements.includes('master')) {
                unlockAchievement('master', 'Skill Master', 'Acquired 10 skills');
            }
            
            const legendaryCount = ownedSkills.filter(s => s.tier === 'LEGENDARY').length;
            if (legendaryCount >= 1 && !achievements.includes('legendary')) {
                unlockAchievement('legendary', 'Legendary Hunter', 'Acquired a Legendary skill');
            }
        }

        // === SPARK EFFECT ===
        function createSparkEffect() {
            for (let i = 0; i < 12; i++) {
                const spark = document.createElement('div');
                spark.style.cssText = `
                    position: fixed;
                    width: 3px;
                    height: 3px;
                    background: linear-gradient(135deg, rgba(245,158,11,0.6), rgba(239,68,68,0.6));
                    border-radius: 50%;
                    top: 50%;
                    left: 50%;
                    pointer-events: none;
                    z-index: 9999;
                `;
                document.body.appendChild(spark);
                
                const angle = (Math.PI * 2 * i) / 12;
                const velocity = Math.random() * 2 + 1.5;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;
                
                let x = 0, y = 0, opacity = 0.8;
                const animate = () => {
                    x += vx * 0.8;
                    y += vy * 0.8;
                    opacity -= 0.015;
                    spark.style.transform = `translate(${x}px, ${y}px)`;
                    spark.style.opacity = opacity;
                    
                    if (opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        spark.remove();
                    }
                };
                animate();
            }
        }

        // === MASTERY SYSTEM ===
        let skillMastery = JSON.parse(localStorage.getItem('skill_mastery') || '{}');
        
        function gainMasteryXP(skillId, amount = 1) {
            if (!skillMastery[skillId]) {
                skillMastery[skillId] = { xp: 0, level: 1 };
            }
            
            skillMastery[skillId].xp += amount;
            
            // Level up every 10 XP
            if (skillMastery[skillId].xp >= skillMastery[skillId].level * 10) {
                skillMastery[skillId].level++;
                showNotification(`Skill Mastery Level Up! Lvl ${skillMastery[skillId].level}`, 'achievement');
            }
            
            localStorage.setItem('skill_mastery', JSON.stringify(skillMastery));
        }

        function getMasteryProgress(skillId) {
            const mastery = skillMastery[skillId] || { xp: 0, level: 1 };
            const xpNeeded = mastery.level * 10;
            const progress = (mastery.xp % xpNeeded) / xpNeeded * 100;
            return { ...mastery, progress };
        }

        // === DATA LOADING ===
        let ownedSkills = [];
        
        function loadOwnedSkills() {
            try {
                const stored = localStorage.getItem('cosmic_skills');
                if (stored) {
                    const allSkills = JSON.parse(stored);
                    // Filter for owned skills only (fused or marked as owned)
                    ownedSkills = allSkills.filter(skill => 
                        skill.fusionIngredients || skill.owned === true
                    );
                    console.log(`✅ Loaded ${ownedSkills.length} owned skills from Fusion Laboratory`);
                    renderSkillArchive();
                } else {
                    console.log('⚠️ No skills found in localStorage. Please visit workshop_phase3.html to fuse skills.');
                    renderEmptyState();
                }
            } catch (error) {
                console.error('❌ Error loading skills:', error);
                renderEmptyState();
            }
        }

        function renderSkillArchive() {
            const container = document.querySelector('#left-panel .panel-content');
            
            if (ownedSkills.length === 0) {
                renderEmptyState();
                return;
            }

            // Calculate collection stats
            const tierCounts = {
                LEGENDARY: ownedSkills.filter(s => s.tier === 'LEGENDARY').length,
                RARE: ownedSkills.filter(s => s.tier === 'RARE').length,
                COMMON: ownedSkills.filter(s => s.tier === 'COMMON').length
            };

            container.innerHTML = '';

            // Add collection stats
            const statsBar = document.createElement('div');
            statsBar.className = 'collection-stats';
            statsBar.innerHTML = `
                <div class="stat-badge" title="Total Skills">
                    <span>📦</span>
                    <span class="stat-value">${ownedSkills.length}</span>
                </div>
                <div class="stat-badge" title="Legendary Skills">
                    <span>⭐</span>
                    <span class="stat-value">${tierCounts.LEGENDARY}</span>
                </div>
                <div class="stat-badge" title="Rare Skills">
                    <span>💎</span>
                    <span class="stat-value">${tierCounts.RARE}</span>
                </div>
                <div class="stat-badge" title="Common Skills">
                    <span>🔹</span>
                    <span class="stat-value">${tierCounts.COMMON}</span>
                </div>
            `;
            container.appendChild(statsBar);

            const skillList = document.createElement('div');
            skillList.style.cssText = 'display:flex; flex-direction:column; gap:0.6rem; padding:0.8rem; overflow-y:auto; height:calc(100% - 50px);';

            ownedSkills.forEach((skill, index) => {
                const skillCard = document.createElement('div');
                skillCard.className = `skill-card ${skill.tier === 'LEGENDARY' ? 'legendary' : skill.tier === 'RARE' ? 'rare' : ''}`;
                skillCard.style.cssText = `
                    background: linear-gradient(135deg, rgba(139, 92, 246, 0.06) 0%, rgba(139, 92, 246, 0.03) 100%);
                    border: 1px solid rgba(139, 92, 246, 0.2);
                    border-radius: 8px;
                    padding: 0.9rem;
                    cursor: pointer;
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    animation-delay: ${index * 0.04}s;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                `;

                // Icon based on type
                const icon = getSkillIcon(skill.tags[0]);
                const tierColor = getTierColor(skill.tier);
                const mastery = getMasteryProgress(skill.id);

                skillCard.innerHTML = `
                    <div class="skill-card-inner">
                        <div class="skill-card-header">
                            <div style="flex: 1;">
                                <div class="skill-card-title" style="color:${tierColor};">${skill.name}</div>
                                <div style="font-size:0.7rem; color:var(--text-dim); margin-top:0.3rem; font-weight:600;">${skill.tier} • ${skill.type}</div>
                            </div>
                            <div class="skill-card-icon">${icon}</div>
                        </div>
                        
                        <div class="skill-tags">
                            ${skill.tags.slice(0, 3).map(tag => 
                                `<span class="skill-tag">${tag}</span>`
                            ).join('')}
                        </div>
                        
                        ${skill.fusionIngredients ? '<div class="fused-badge">⚡ FUSED SKILL</div>' : ''}
                        
                        <div class="mastery-bar">
                            <div class="mastery-fill" style="width: ${mastery.progress}%;"></div>
                        </div>
                        
                        <div class="skill-meta">
                            <span style="font-weight:600; color:var(--accent-glow);">Lvl ${mastery.level}</span>
                            <span>•</span>
                            <span>${Math.floor(mastery.progress)}% Mastery</span>
                        </div>
                    </div>
                `;

                // Hover effects
                skillCard.onmouseenter = () => {
                    playSound('hover');
                    skillCard.style.background = 'linear-gradient(135deg, rgba(139, 92, 246, 0.12) 0%, rgba(139, 92, 246, 0.06) 100%)';
                    skillCard.style.borderColor = 'var(--accent-glow)';
                    skillCard.style.transform = 'translateX(4px) scale(1.02)';
                    skillCard.style.boxShadow = '0 4px 16px rgba(139,92,246,0.3)';
                };
                skillCard.onmouseleave = () => {
                    skillCard.style.background = 'linear-gradient(135deg, rgba(139, 92, 246, 0.06) 0%, rgba(139, 92, 246, 0.03) 100%)';
                    skillCard.style.borderColor = 'rgba(139, 92, 246, 0.2)';
                    skillCard.style.transform = 'translateX(0) scale(1)';
                    skillCard.style.boxShadow = '0 2px 8px rgba(0,0,0,0.2)';
                };

                skillCard.onclick = () => {
                    playSound('select');
                    gainMasteryXP(skill.id, 1);
                    selectSkill(skill);
                    renderSkillArchive(); // Re-render to update mastery
                };

                skillList.appendChild(skillCard);
            });

            container.appendChild(skillList);
        }

        function renderEmptyState() {
            const container = document.querySelector('#left-panel .panel-content');
            container.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:2rem; text-align:center; color:var(--text-dim);">
                    <div style="font-size:3rem; opacity:0.3; margin-bottom:1rem;">📚</div>
                    <div style="font-size:0.9rem; font-weight:600; margin-bottom:0.5rem;">No Owned Skills</div>
                    <div style="font-size:0.75rem; line-height:1.6; max-width:200px;">
                        Visit the <a href="workshop_phase3.html" style="color:var(--accent-glow); text-decoration:none;">Fusion Laboratory</a> to fuse and unlock skills.
                    </div>
                </div>
            `;
        }

        function getSkillIcon(tag) {
            const icons = {
                'VOID': '🌌',
                'SOLAR': '☀️',
                'NATURE': '🌿',
                'ICE': '❄️',
                'BLOOD': '🩸',
                'COSMIC': '✨',
                'FIRE': '🔥',
                'WATER': '💧',
                'EARTH': '🪨',
                'AIR': '💨'
            };
            return icons[tag] || '⚡';
        }

        function getTierColor(tier) {
            const colors = {
                'LEGENDARY': '#f59e0b',
                'RARE': '#3b82f6',
                'COMMON': '#64748b',
                'FORBIDDEN': '#ef4444'
            };
            return colors[tier] || '#8b5cf6';
        }

        function selectSkill(skill) {
            console.log('🎯 Selected skill:', skill.name);
            // TODO: Update chart and card preview with selected skill
            showSkillDetails(skill);
        }

        function showSkillDetails(skill) {
            const rightPanel = document.querySelector('#right-panel .panel-content');
            rightPanel.innerHTML = `
                <div style="padding:1rem;">
                    <div style="font-size:1.4rem; font-weight:700; color:${getTierColor(skill.tier)}; margin-bottom:1rem;">
                        ${skill.name}
                    </div>
                    
                    <div style="display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap;">
                        ${skill.tags.map(tag => 
                            `<span style="background:rgba(139,92,246,0.2); padding:0.3rem 0.6rem; border-radius:4px; font-size:0.7rem; color:var(--accent-glow);">${tag}</span>`
                        ).join('')}
                    </div>

                    <div style="margin-bottom:1.5rem;">
                        <div style="font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.5rem;">Description</div>
                        <div style="font-size:0.85rem; line-height:1.6;">${skill.description || 'No description available.'}</div>
                    </div>

                    <div style="margin-bottom:1.5rem;">
                        <div style="font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.5rem;">Stats</div>
                        <div style="display:grid; gap:0.5rem;">
                            ${renderStatBar('Damage', skill.stats.damage || 0, 60, '#ef4444')}
                            ${renderStatBar('Cost', skill.stats.cost || 0, 30, '#3b82f6')}
                            ${renderStatBar('Cooldown', skill.stats.cooldown || 0, 15, '#f59e0b')}
                        </div>
                    </div>

                    ${skill.lore_quote ? `
                        <div style="margin-top:1.5rem; padding:1rem; background:rgba(139,92,246,0.05); border-left:2px solid var(--accent); font-style:italic; font-size:0.8rem; color:var(--text-dim);">
                            ${skill.lore_quote}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderStatBar(label, value, max, color) {
            const percentage = Math.min(100, (value / max) * 100);
            return `
                <div>
                    <div style="display:flex; justify-content:space-between; font-size:0.75rem; margin-bottom:0.25rem;">
                        <span style="color:var(--text-dim);">${label}</span>
                        <span style="color:#fff; font-weight:600;">${value}</span>
                    </div>
                    <div style="height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden;">
                        <div style="height:100%; width:${percentage}%; background:${color}; transition:width 0.3s ease;"></div>
                    </div>
                </div>
            `;
        }

        // === INITIALIZATION ===
        console.log('🚀 Cosmic Card Creator initialized');
        console.log('📱 Viewport:', window.innerWidth, 'x', window.innerHeight);
        console.log('🔄 Orientation:', window.orientation || screen.orientation?.type);
        
        // Load skills on startup
        window.addEventListener('load', () => {
            createParticles();
            loadOwnedSkills();
            checkAchievements();
            
            // Start ambient sound on first user interaction
            document.body.addEventListener('click', () => {
                startAmbientSound();
            }, { once: true });
        });

        // Reload skills when returning from fusion lab
        window.addEventListener('focus', () => {
            console.log('🔄 Window focused, reloading skills...');
            const previousCount = ownedSkills.length;
            loadOwnedSkills();
            
            // Check if new skills were added
            setTimeout(() => {
                if (ownedSkills.length > previousCount) {
                    showNotification(`+${ownedSkills.length - previousCount} New Skill(s) Detected!`, 'achievement');
                    checkAchievements();
                }
            }, 100);
        });
        
        // Detect orientation changes
        window.addEventListener('orientationchange', () => {
            console.log('🔄 Orientation changed to:', window.orientation || screen.orientation?.type);
        });
        
        // Prevent zoom on double-tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Manual refresh button
        document.querySelector('#left-panel .cosmic-btn').onclick = () => {
            playSound('click');
            console.log('🔄 Manual refresh triggered');
            const previousCount = ownedSkills.length;
            loadOwnedSkills();
            
            setTimeout(() => {
                if (ownedSkills.length > previousCount) {
                    showNotification('Skill Database Synchronized!', 'info');
                    checkAchievements();
                } else {
                    showNotification('Database Already Up-to-Date', 'info');
                }
            }, 100);
        };
    </script>

</body>
</html>
