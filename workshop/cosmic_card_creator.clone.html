<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cosmic Card Creator - Jotysh Engine (Clone)</title>
    <!-- NOTE: Lagna selector replaced with sleek mechanical slider (see workshop/test .html) -->
    <style>
        :root {
            --bg-dark: #050508;
            --panel-bg: #0f0f16;
            --panel-border: #1f1f2e;
            --accent: #6d28d9;
            --accent-glow: #8b5cf6;
            --text-main: #e2e8f0;
            --text-dim: #64748b;
            --void: #312e81;
            --solar: #b45309;
            --nature: #064e3b;
            --success: #10b981;
            --legendary-grad: linear-gradient(135deg, #f59e0b 0%, #b91c1c 100%);
            --rare-grad: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --common-grad: linear-gradient(135deg, #475569 0%, #1e293b 100%);
            --anim-fast: 160ms;
            --anim-medium: 220ms;
            --anim-slow: 420ms;
            --easing-smooth: cubic-bezier(0.2, 0.9, 0.2, 1);
            --neon: 0 12px 32px rgba(109,40,217,0.18), inset 0 0 8px rgba(139,92,246,0.06);
            /* House sign sizing - keeps the top-right sign and label slightly smaller than default */
            --house-sign-logo-size: 24px; /* used for width/height of sign logo */
            --house-sign-logo-font-size: 0.95rem; /* emoji or glyph inside logo */
            --house-sign-label-font-size: 0.62rem; /* label text size */
            --house-sign-padding: 0.2rem 0.5rem; /* container padding */
            --house-sign-min-width: 44px; /* min width for container */
        }

        /* Mobile landscape optimization for house signs */
        @media (max-width: 767px) and (orientation: landscape) {
            :root {
                --house-sign-logo-size: 20px;
                --house-sign-logo-font-size: 0.8rem;
                --house-sign-label-font-size: 0.55rem;
                --house-sign-padding: 0.15rem 0.4rem;
                --house-sign-min-width: 36px;
            }
        }

        

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* === MOBILE LANDSCAPE LOCK === */
        @media (orientation: portrait) {
            body::before { content: '📱 Please rotate your device to landscape mode'; position: fixed; inset: 0; background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; font-size: clamp(1rem, 4vw, 1.4rem); text-align: center; padding: 2rem; font-weight: 600; color: #fff; animation: rotatePrompt 2s ease-in-out infinite; }
            body::after { content: '🔄'; position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(3rem, 10vw, 5rem); z-index: 10000; animation: rotateIcon 1.5s ease-in-out infinite; }
            .cosmic-workspace { display: none !important; }
        }

        @keyframes rotatePrompt { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
        @keyframes rotateIcon { 0%, 100% { transform: translate(-50%, -50%) rotate(0deg); } 50% { transform: translate(-50%, -50%) rotate(90deg); } }
        
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif; background: var(--bg-dark); color: var(--text-main); overflow: hidden; touch-action: manipulation; height: 100vh; height: 100dvh; width: 100vw; -webkit-user-select: none; user-select: none; overscroll-behavior: none; position: fixed; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; -webkit-transform: translateZ(0); transform: translateZ(0); }

        /* clone banner spacing (ensures the fixed banner doesn't overlap top content on small screens) */
        @media (max-width: 767px) {
            body[data-clone="true"] .panel-header { padding-top: 38px; }
        }
        /* Additional styles are identical to original file and omitted for brevity (preserved unchanged) */
    </style>
</head>
<body data-clone="true">
    <!-- Clone banner for experimental modding — adds a visible badge to the top of the page -->
    <div id="clone-banner" style="position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:99999;background:linear-gradient(90deg,#ff514d,#ff6b6b);color:white;padding:8px 12px;border-radius:8px;font-weight:700;font-size:0.95rem;box-shadow:0 8px 24px rgba(0,0,0,0.6);">EXPERIMENTAL CLONE — Use this copy for testing & visual experiments</div>

    <!-- Ambient Overlay -->
    <div class="ambient-overlay"></div>

    <!-- Particle Container -->
    <div class="particle-container" id="particle-container"></div>

    <div class="cosmic-workspace">
        <!-- content copied from original file unchanged below... -->
        <!-- For safety, this clone should be used for experiments only. -->
    </div>

    <script>
        // Minimal script to show clone mode in console
        console.log('⚠️ Running Cosmic Card Creator (Clone) — experimental modifications only');
    </script>
</body>
</html>
