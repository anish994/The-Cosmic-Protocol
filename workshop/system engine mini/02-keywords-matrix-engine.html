<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keywords Matrix Engine - Foundation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 107, 157, 0.1);
            border-radius: 15px;
            border: 2px solid rgba(255, 107, 157, 0.3);
        }
        
        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .stats {
            font-size: 1.1em;
            color: #ffa502;
            margin-top: 15px;
        }
        
        .keywords-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .keyword-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .keyword-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .keyword-name {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .keyword-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .keyword-desc {
            font-size: 0.9em;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px;
            padding: 15px 25px;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 107, 157, 0.3);
            border-radius: 50px;
            color: #fff;
            outline: none;
        }
        
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .filter-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .filter-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .filter-btn.active {
            background: rgba(255, 107, 157, 0.3);
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.4);
        }
    </style>
</head>

        let searchQuery = '';

        function init() {
            updateStats();
            renderCategoryFilter();
            renderKeywords();
            setupSearch();
        }

        function updateStats() {
            const totalKeywords = Object.keys(TAG_DATA).length;
            const categories = new Set(Object.values(TAG_DATA).map(k => k.category));
            
            document.getElementById('totalKeywords').textContent = totalKeywords;
            document.getElementById('categoryCount').textContent = categories.size;
        }

        function renderCategoryFilter() {
            const categories = new Set(Object.values(TAG_DATA).map(k => k.category));
            const filterContainer = document.getElementById('categoryFilter');
            
            // All button
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'ALL';
            allBtn.style.borderColor = '#ff6b9d';
            allBtn.onclick = () => filterCategory('all');
            filterContainer.appendChild(allBtn);
            
            // Category buttons
            [...categories].sort().forEach(cat => {
                const keyword = Object.values(TAG_DATA).find(k => k.category === cat);
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = cat.toUpperCase();
                btn.style.borderColor = keyword.color;
                btn.onclick = () => filterCategory(cat);
                filterContainer.appendChild(btn);
            });
        }

        function filterCategory(category) {
            currentFilter = category;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderKeywords();
        }

        function setupSearch() {
            document.getElementById('searchBox').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderKeywords();
            });
        }

        function renderKeywords() {
            const grid = document.getElementById('keywordsGrid');
            grid.innerHTML = '';
            
            Object.entries(TAG_DATA).forEach(([key, data]) => {
                // Filter by category
                if (currentFilter !== 'all' && data.category !== currentFilter) return;
                
                // Filter by search
                if (searchQuery && !data.name.toLowerCase().includes(searchQuery) && 
                    !data.short.toLowerCase().includes(searchQuery) &&
                    !data.medium.toLowerCase().includes(searchQuery)) return;
                
                const card = document.createElement('div');
                card.className = 'keyword-card';
                card.style.borderColor = data.color;
                
                card.innerHTML = `
                    <div class="keyword-name" style="color: ${data.color};">${data.name}</div>
                    <div class="keyword-category" style="background: ${data.color}33; color: ${data.color}; border: 1px solid ${data.color};">
                        ${data.category}
                    </div>
                    <div class="keyword-desc">${data.medium}</div>
                `;
                
                card.onclick = () => showDetails(key, data);
                grid.appendChild(card);
            });
        }

        function showDetails(key, data) {
            alert(`${data.name}\n\nCategory: ${data.category}\n\n${data.detailed.description}\n\nStrengths:\n${data.detailed.strengths.join('\n')}\n\nWeaknesses:\n${data.detailed.weaknesses.join('\n')}\n\nCombos:\n${data.detailed.combos.join('\n')}`);
        }

        // Start the engine
        init();
    </script>
</body>
</html>
