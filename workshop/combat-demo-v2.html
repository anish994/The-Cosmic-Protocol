<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat - Pokemon x D&D Fusion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            background: linear-gradient(90deg, #1a1a2e, #0f0f23);
            padding: 12px 20px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }

        .back-btn {
            padding: 8px 16px;
            background: #8b0000;
            color: #fff;
            border: 1px solid #a52a2a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        /* MAIN CONTAINER */
        .battle-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            flex: 1;
            overflow: hidden;
        }

        /* TOP-RIGHT: ENEMY */
        .enemy-zone {
            background: linear-gradient(135deg, rgba(255,100,100,0.1), rgba(100,50,0,0.1));
            border-right: 2px solid #333;
            border-bottom: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 30px;
            position: relative;
        }

        .enemy-name {
            font-size: 14px;
            color: #ff6b6b;
            margin-bottom: 8px;
            text-align: right;
        }

        .enemy-sprite {
            width: 180px;
            height: 180px;
            background-image: url('../05-fusion/demo/game-assets/character-sprites/classes/Mages/Mage_Hooded_BROWN.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8)) hue-rotate(15deg);
        }

        .enemy-hp-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 16px;
            border-radius: 6px;
            border: 2px solid #ff6b6b;
            min-width: 150px;
        }

        .hp-label {
            font-size: 10px;
            color: #ff6b6b;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .hp-bar {
            background: #222;
            height: 12px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffa500);
            transition: width 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .hp-text {
            font-size: 11px;
            margin-top: 4px;
            text-align: right;
            color: #fff;
        }

        /* CENTER: D&D NARRATION */
        .narration-zone {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            background: linear-gradient(135deg, #1a1a2e, #0f0f23);
            border-right: 2px solid #333;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-y: auto;
        }

        .narration-title {
            font-size: 12px;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            width: 100%;
        }

        .narration-text {
            font-size: 18px;
            line-height: 1.8;
            color: #e0e0e0;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-log {
            font-size: 11px;
            text-align: left;
            border-top: 1px solid #333;
            padding-top: 16px;
            max-height: 100px;
            overflow-y: auto;
            width: 100%;
        }

        .log-entry {
            margin-bottom: 6px;
            padding: 4px 8px;
            background: rgba(255,255,255,0.05);
            border-left: 3px solid;
            border-radius: 2px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-attack { border-color: #ff6b6b; color: #ff6b6b; }
        .log-defend { border-color: #4dabf7; color: #4dabf7; }
        .log-heal { border-color: #69db7c; color: #69db7c; }

        /* BOTTOM-LEFT: PLAYER */
        .player-zone {
            background: linear-gradient(135deg, rgba(100,100,255,0.1), rgba(50,100,200,0.1));
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 30px;
            position: relative;
        }

        .player-name {
            font-size: 14px;
            color: #4dabf7;
            margin-bottom: 8px;
        }

        .player-sprite {
            width: 180px;
            height: 180px;
            background-image: url('../05-fusion/demo/game-assets/character-sprites/classes/Mages/Mage_Fem_Red.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
            animation: idleBreathe 3s ease-in-out infinite;
        }

        @keyframes idleBreathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .player-sprite.attacking {
            animation: attackThrust 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes attackThrust {
            0% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(40px) translateY(-20px) scale(1.1); }
            100% { transform: translateX(0) translateY(0); }
        }

        .player-hp-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 16px;
            border-radius: 6px;
            border: 2px solid #4dabf7;
            min-width: 150px;
        }

        /* BOTTOM-RIGHT: ACTIONS */
        .actions-zone {
            background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(10,10,15,0.5));
            border-top: 2px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-label {
            font-size: 11px;
            color: #ffd700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .action-btn {
            padding: 14px;
            border: 2px solid;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            text-align: center;
            font-family: 'Courier New', monospace;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.1);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.3s;
            pointer-events: none;
        }

        .action-btn:hover::before {
            transform: scaleY(1);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-btn.attack {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .action-btn.defend {
            border-color: #4dabf7;
            color: #4dabf7;
        }

        .action-btn.heal {
            border-color: #69db7c;
            color: #69db7c;
        }

        .action-btn.summon {
            border-color: #ffa726;
            color: #ffa726;
        }

        .btn-icon {
            font-size: 18px;
        }

        .btn-cd {
            font-size: 9px;
            opacity: 0.7;
        }

        /* FLOATING DAMAGE */
        .damage-pop {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.9);
            animation: damagePop 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            letter-spacing: 1px;
        }

        @keyframes damagePop {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            50% { transform: translateY(-40px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }

        /* SCROLLBAR */
        .narration-zone::-webkit-scrollbar {
            width: 4px;
        }

        .narration-zone::-webkit-scrollbar-thumb {
            background: #666;
            border-radius: 2px;
        }

        .action-log::-webkit-scrollbar {
            width: 4px;
        }

        .action-log::-webkit-scrollbar-thumb {
            background: #666;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="title">⚔️ BATTLE</div>
        <button class="back-btn" onclick="goBack()">← BACK</button>
    </div>

    <!-- BATTLE CONTAINER -->
    <div class="battle-container">
        <!-- TOP-RIGHT: ENEMY -->
        <div class="enemy-zone">
            <div class="enemy-hp-container">
                <div class="hp-label">ENEMY HP</div>
                <div class="hp-bar">
                    <div class="hp-fill" id="enemyHpBar" style="width: 100%;"></div>
                </div>
                <div class="hp-text" id="enemyHpText">80/80</div>
            </div>
            <div class="enemy-name" id="enemyName">Training Dummy</div>
            <div class="enemy-sprite" id="enemySprite"></div>
        </div>

        <!-- CENTER: D&D NARRATION -->
        <div class="narration-zone">
            <div class="narration-title">⚔️ Battle Log</div>
            <div class="narration-text" id="mainNarration">
                The arena awaits...
            </div>
            <div class="action-log" id="actionLog"></div>
        </div>

        <!-- BOTTOM-LEFT: PLAYER -->
        <div class="player-zone">
            <div class="player-hp-container">
                <div class="hp-label">YOUR HP</div>
                <div class="hp-bar">
                    <div class="hp-fill" id="playerHpBar" style="width: 100%;"></div>
                </div>
                <div class="hp-text" id="playerHpText">100/100</div>
            </div>
            <div class="player-name" id="playerName">Shadow Blade</div>
            <div class="player-sprite" id="playerSprite"></div>
        </div>

        <!-- BOTTOM-RIGHT: ACTIONS -->
        <div class="actions-zone">
            <div class="action-label">Choose Your Move:</div>
            <div class="action-buttons">
                <button class="action-btn attack" id="attackBtn" onclick="performAction('attack')">
                    <div class="btn-icon">⚔️</div>
                    <div>ATTACK</div>
                    <div class="btn-cd" id="attackCD">READY</div>
                </button>
                <button class="action-btn defend" id="defendBtn" onclick="performAction('defend')">
                    <div class="btn-icon">🛡️</div>
                    <div>DEFEND</div>
                    <div class="btn-cd" id="defendCD">READY</div>
                </button>
                <button class="action-btn heal" id="healBtn" onclick="performAction('heal')">
                    <div class="btn-icon">💚</div>
                    <div>HEAL</div>
                    <div class="btn-cd" id="healCD">READY</div>
                </button>
                <button class="action-btn summon" id="summonBtn" onclick="performAction('summon')">
                    <div class="btn-icon">👥</div>
                    <div>SUMMON</div>
                    <div class="btn-cd" id="summonCD">READY</div>
                </button>
            </div>
        </div>
    </div>

    <script src="../shared/skillSystem.js"></script>
    <script>
        // Combat state
        let cardData = {
            name: 'Shadow Blade',
            tier: 'Common',
            power: 45,
            cooldown: 3,
            versatility: 28,
            density: 6,
            hp: 100,
            maxHp: 100,
            element: 'Fire',
            actions: {
                attack: { base: 45, cooldown: 2, current: 0 },
                defend: { base: 30, cooldown: 3, current: 0 },
                heal: { base: 25, cooldown: 4, current: 0 },
                summon: { base: 35, cooldown: 5, current: 0 }
            }
        };

        let enemyData = {
            name: 'Dark Wizard',
            hp: 80,
            maxHp: 80
        };

        const narratives = {
            attack: [
                "{name} lunges forward with a devastating strike!",
                "{name} channels power and unleashes a fierce blow!",
                "{name} moves with incredible speed to attack!",
                "{name} draws upon ancient magic to strike true!"
            ],
            defend: [
                "{name} braces for impact, raising their defenses!",
                "{name} channels protective energy around themselves!",
                "{name} assumes a defensive stance!",
                "{name} summons a barrier of pure will!"
            ],
            heal: [
                "{name} feels rejuvenating energy flow through them!",
                "{name} channels healing magic, mending their wounds!",
                "{name} takes a moment to recover their strength!",
                "{name} glows with restorative power!"
            ],
            summon: [
                "{name} calls forth a powerful {element} ally to aid in battle!",
                "A magnificent {element} spirit manifests before {name}!",
                "{name} summons the ancient power of {element}!",
                "The {element} force answers {name}'s call!"
            ],
            victory: "Victory! {name} stands triumphant!",
            defeat: "The battle ends... {name} falls to the shadows."
        };

        function init() {
            try {
                const savedCard = localStorage.getItem('activeCard');
                if (savedCard) {
                    const card = JSON.parse(savedCard);
                    cardData = { ...cardData, ...card };
                    console.log('✅ Card loaded from mini-test:', cardData);
                }
            } catch (e) {
                console.log('Using default card:', e);
            }

            document.getElementById('playerName').textContent = cardData.name;
            document.getElementById('enemyName').textContent = enemyData.name;
            updateUI();
            updateNarration(`${cardData.name} faces ${enemyData.name} in mortal combat!`);
            addLog('system', `⚔️ Battle begins!`);
        }

        function updateUI() {
            const playerPercent = (cardData.hp / cardData.maxHp) * 100;
            const enemyPercent = (enemyData.hp / enemyData.maxHp) * 100;

            document.getElementById('playerHpBar').style.width = playerPercent + '%';
            document.getElementById('playerHpText').textContent = `${cardData.hp}/${cardData.maxHp}`;
            document.getElementById('enemyHpBar').style.width = enemyPercent + '%';
            document.getElementById('enemyHpText').textContent = `${enemyData.hp}/${enemyData.maxHp}`;
        }

        function performAction(action) {
            const actionData = cardData.actions[action];
            if (!actionData || actionData.current > 0) {
                updateNarration(`⏱️ ${action.toUpperCase()} is on cooldown!`);
                return;
            }

            const playerSprite = document.getElementById('playerSprite');
            let damage = 0, heal = 0, narrative = '';

            switch (action) {
                case 'attack':
                    damage = Math.round(actionData.base * (1 + cardData.power / 100));
                    enemyData.hp = Math.max(0, enemyData.hp - damage);

                    playerSprite.classList.add('attacking');
                    setTimeout(() => playerSprite.classList.remove('attacking'), 600);

                    narrative = narratives.attack[Math.floor(Math.random() * narratives.attack.length)];
                    narrative = narrative.replace('{name}', cardData.name);

                    spawnDamagePop(`-${damage}`, 'enemy');
                    addLog('attack', `⚔️ ${cardData.name} strikes for ${damage} damage!`);
                    break;

                case 'defend':
                    const shield = Math.round(actionData.base * (1 + cardData.versatility / 100));
                    narrative = narratives.defend[Math.floor(Math.random() * narratives.defend.length)];
                    narrative = narrative.replace('{name}', cardData.name);

                    spawnDamagePop(`+${shield}`, 'player');
                    addLog('defend', `🛡️ ${cardData.name} raises their defense by ${shield}!`);
                    break;

                case 'heal':
                    heal = Math.round(actionData.base * (1 + cardData.power / 50));
                    cardData.hp = Math.min(cardData.hp + heal, cardData.maxHp);

                    narrative = narratives.heal[Math.floor(Math.random() * narratives.heal.length)];
                    narrative = narrative.replace('{name}', cardData.name);

                    spawnDamagePop(`+${heal}`, 'player');
                    addLog('heal', `💚 ${cardData.name} recovers ${heal} HP!`);
                    break;

                case 'summon':
                    narrative = narratives.summon[Math.floor(Math.random() * narratives.summon.length)];
                    narrative = narrative.replace('{name}', cardData.name).replace('{element}', cardData.element);

                    spawnDamagePop('SUMMON', 'player');
                    addLog('system', `👥 A ${cardData.element} ally manifests!`);
                    break;
            }

            actionData.current = actionData.cooldown;
            updateNarration(narrative);
            updateCooldowns();
            updateUI();

            if (enemyData.hp <= 0) {
                setTimeout(() => {
                    updateNarration(narratives.victory.replace('{name}', cardData.name));
                    addLog('system', `🏆 VICTORY!`);
                    disableAllButtons();
                }, 800);
            }
        }

        function updateCooldowns() {
            const actions = ['attack', 'defend', 'heal', 'summon'];
            actions.forEach(action => {
                if (cardData.actions[action].current > 0) {
                    cardData.actions[action].current--;
                }

                const btn = document.getElementById(action + 'Btn');
                const cdDisplay = document.getElementById(action + 'CD');
                const cd = cardData.actions[action].current;

                btn.disabled = cd > 0;
                cdDisplay.textContent = cd > 0 ? `${cd}s` : 'READY';
            });
        }

        function updateNarration(text) {
            document.getElementById('mainNarration').textContent = text;
        }

        function addLog(type, text) {
            const log = document.getElementById('actionLog');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = text;
            log.insertBefore(entry, log.firstChild);

            while (log.children.length > 6) {
                log.removeChild(log.lastChild);
            }
        }

        function spawnDamagePop(text, target) {
            const zone = target === 'enemy' ? document.querySelector('.enemy-zone') : document.querySelector('.player-zone');
            const pop = document.createElement('div');
            pop.className = 'damage-pop';
            pop.textContent = text;
            pop.style.color = text.startsWith('+') ? '#69db7c' : text.startsWith('-') ? '#ff6b6b' : '#ffa726';
            pop.style.left = Math.random() * 100 + 'px';
            pop.style.top = Math.random() * 100 + 'px';

            zone.appendChild(pop);
            setTimeout(() => pop.remove(), 800);
        }

        function disableAllButtons() {
            document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = true);
        }

        function goBack() {
            window.location.href = 'mini-test.html';
        }

        init();
        setInterval(updateCooldowns, 1000);
    </script>
</body>
</html>
