<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporary Vedic Chart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .vedic-chart {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 80%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            background-color: #1e1e2e;
            border: 2px solid #6d28d9;
            border-radius: 12px;
            padding: 10px;
        }

        .house {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #2e2e3e;
            border: 1px solid #8b5cf6;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            color: #e2e8f0;
        }

        .house-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .house-content {
            font-size: 0.9rem;
        }
        .lagna-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
        }
        .lagna-button {
            background: linear-gradient(180deg, #312e81, #1f2937);
            color: #e2e8f0;
            border: 1px solid rgba(139,92,246,0.6);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 150ms ease, box-shadow 150ms ease;
        }
        .lagna-button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(99,102,241,0.08); }
        .lagna-button.active { box-shadow: 0 8px 30px rgba(99,102,241,0.16); border-color: #c084fc; }
        .controls { width: 80%; max-width: 800px; margin-bottom: 8px; display:flex; flex-direction:column; align-items:center; }
        .degree-slider { width: 60%; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="controls">
        <div class="lagna-selector" id="lagna-selector" aria-label="Lagna Selector"></div>
        <div style="margin-top:6px; width:100%; display:flex; justify-content:center; gap:8px; align-items:center;">
            <label for="degree" style="font-size:0.9rem; color:#cbd5e1;">Degree</label>
            <input id="degree" class="degree-slider" type="range" min="0" max="29.999" step="0.001" value="0">
            <span id="degree-value" style="width:40px; text-align:center;">0°</span>
        </div>
    </div>
    <div class="vedic-chart">
        <div class="house" id="house-1">
            <div class="house-title">House 1</div>
            <div class="house-content">Self</div>
        </div>
        <div class="house" id="house-2">
            <div class="house-title">House 2</div>
            <div class="house-content">Resources</div>
        </div>
        <div class="house" id="house-3">
            <div class="house-title">House 3</div>
            <div class="house-content">Communication</div>
        </div>
        <div class="house" id="house-4">
            <div class="house-title">House 4</div>
            <div class="house-content">Home</div>
        </div>
        <div class="house" id="house-5">
            <div class="house-title">House 5</div>
            <div class="house-content">Creativity</div>
        </div>
        <div class="house" id="house-6">
            <div class="house-title">House 6</div>
            <div class="house-content">Health</div>
        </div>
        <div class="house" id="house-7">
            <div class="house-title">House 7</div>
            <div class="house-content">Partnerships</div>
        </div>
        <div class="house" id="house-8">
            <div class="house-title">House 8</div>
            <div class="house-content">Transformation</div>
        </div>
        <div class="house" id="house-9">
            <div class="house-title">House 9</div>
            <div class="house-content">Fortune</div>
        </div>
        <div class="house" id="house-10">
            <div class="house-title">House 10</div>
            <div class="house-content">Career</div>
        </div>
        <div class="house" id="house-11">
            <div class="house-title">House 11</div>
            <div class="house-content">Community</div>
        </div>
        <div class="house" id="house-12">
            <div class="house-title">House 12</div>
            <div class="house-content">Spirituality</div>
        </div>
    </div>
    <script>
        // Basic data for zodiac signs and house archetypes
        const zodiacSigns = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
        const houseArchetypes = ["Self","Resources","Communication","Home","Creativity","Health","Partnerships","Transformation","Fortune","Career","Community","Spirituality"];

        // State
        let currentLagna = 0; // 0..11 where 0 is Aries by default
        const lagnaSelector = document.getElementById('lagna-selector');
        const degreeInput = document.getElementById('degree');
        const degreeValue = document.getElementById('degree-value');

        // Render lagna selector buttons
        function renderLagnaSelector() {
            lagnaSelector.innerHTML = '';
            zodiacSigns.forEach((sign, idx) => {
                const btn = document.createElement('button');
                btn.className = 'lagna-button' + (idx === currentLagna ? ' active' : '');
                btn.textContent = sign;
                btn.setAttribute('data-index', idx);
                btn.addEventListener('click', () => setLagna(idx));
                lagnaSelector.appendChild(btn);
            });
        }

        // Set lagna and re-render houses
        function setLagna(idx) {
            currentLagna = idx;
            renderLagnaSelector();
            applyLagnaToHouses();
            // simple visual cue
            const chart = document.querySelector('.vedic-chart');
            chart.classList.remove('lagna-anim');
            void chart.offsetWidth; // trigger reflow
            chart.classList.add('lagna-anim');
        }

        function applyLagnaToHouses() {
            const houses = document.querySelectorAll('.house');
            for (let i = 0; i < houses.length; i++) {
                const houseIdx = i; // UI house index 0..11
                const signIndex = (currentLagna + houseIdx) % 12;
                const signName = zodiacSigns[signIndex];
                const archetype = houseArchetypes[houseIdx];
                const house = houses[i];
                house.querySelector('.house-title').textContent = `House ${houseIdx + 1} - ${archetype}`;
                house.querySelector('.house-content').textContent = `${signName}`;
                house.setAttribute('data-sign', signName);
            }
        }

        // Degree slider handling - influences nakshatra/pada (future)
        degreeInput.addEventListener('input', () => {
            degreeValue.textContent = `${parseFloat(degreeInput.value).toFixed(2)}°`;
            // placeholder: could trigger nakshatra re-evaluation
        });

        // initial render
        renderLagnaSelector();
        applyLagnaToHouses();
    </script>
    <style>
        .lagna-anim { animation: lagna-rotate 380ms ease; }
        @keyframes lagna-rotate { 0% { transform: translateY(-6px) scale(0.995); opacity:0.96 } 100% { transform: translateY(0) scale(1); opacity:1 } }
    </style>
</body>
</html>
