<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Protocol - Fusion Laboratory</title>
    <style>
        :root {
            --bg-dark: #050508;
            --panel-bg: #0f0f16;
            --panel-border: #1f1f2e;
            --accent: #6d28d9;
            --accent-glow: #8b5cf6;
            --text-main: #e2e8f0;
            --text-dim: #64748b;
            --void: #312e81;
            --solar: #b45309;
            --nature: #064e3b;
            --success: #10b981;
            --legendary-grad: linear-gradient(135deg, #f59e0b 0%, #b91c1c 100%);
            --rare-grad: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --common-grad: linear-gradient(135deg, #475569 0%, #1e293b 100%);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            background: rgba(15, 15, 22, 0.95);
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 10;
            flex-shrink: 0;
        }

        h1 { 
            margin: 0; 
            font-size: 1.1rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* MAIN LAYOUT */
        .container {
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            flex: 1;
            gap: 1px;
            background: var(--panel-border);
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .panel-header {
            padding: 0.8rem 1rem;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .view-tab {
            transition: all 0.2s ease;
        }

        .view-tab.active {
            background: var(--accent) !important;
            color: #fff !important;
        }

        .view-tab:not(.active):hover {
            background: rgba(139,92,246,0.2) !important;
        }

        /* LEFT: SKILL REPOSITORY */
        .search-bar {
            background: #000;
            border: 1px solid var(--panel-border);
            color: white;
            padding: 0.6rem;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .skill-list {
            overflow-y: auto;
            padding: 0.5rem;
            flex: 1;
        }

        .skill-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            padding: 0.8rem;
            margin-bottom: 0.4rem;
            cursor: grab;
            transition: all 0.2s;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .skill-item:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--accent);
            transform: translateX(2px);
        }

        .skill-item.legendary {
            border-color: #f59e0b;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.05), transparent);
        }

        .skill-name { font-weight: bold; color: #fff; margin-bottom: 2px; font-size: 0.95rem; }
        .skill-type { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }

        /* Quick Filters */
        .quick-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #fff;
        }

        /* Engine Row */
        .engine-row {
            display: flex;
            gap: 0.25rem;
            background: none;
            border: none;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: rgba(139,92,246,0.3) transparent;
            position: relative;
            padding: 0 20px;
        }

        .engine-row::-webkit-scrollbar {
            height: 4px;
        }

        .engine-row::-webkit-scrollbar-thumb {
            background: rgba(139,92,246,0.3);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .engine-row {
                scrollbar-width: none;
            }
            .engine-row::-webkit-scrollbar {
                display: none;
            }
            .engine-block {
                padding: 4px 8px;
                font-size: 0.8em;
            }
            .engine-block .engine-icon {
                font-size: 0.9em;
            }
            .engine-block .engine-label {
                font-size: 0.7em;
            }
            .engine-block .engine-count {
                font-size: 0.6em;
            }
        }

        /* Engine Container */
        .engine-container {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid var(--panel-border);
        }

        .engine-block {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            min-width: 0;
            flex-shrink: 0;
            min-width: 100px;
            justify-content: center;
        }



        .engine-block .engine-icon {
            font-size: 1em;
            flex-shrink: 0;
        }

        .engine-block .engine-label {
            font-size: 0.8em;
            font-weight: 600;
            flex-shrink: 0;
            hyphens: none;
            word-break: keep-all;
        }

        .engine-block .engine-count {
            font-size: 0.7em;
            opacity: 0.8;
            margin-left: auto;
            flex-shrink: 0;
        }

        .engine-block.active, .engine-block:focus {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px 0 rgba(139,92,246,0.10);
        }

        .engine-block:not(.active):hover {
            background: rgba(139,92,246,0.18);
            color: #fff;
        }

        /* CENTER: FUSION CORE */
        .fusion-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050508 70%);
            position: relative;
        }

        .fusion-slots-wrapper {
            display: flex;
            gap: 2rem;
            align-items: center;
            margin-bottom: 2rem;
        }

        .fusion-slot {
            width: 120px;
            height: 160px;
            border: 2px dashed var(--text-dim);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .fusion-slot.active {
            border-color: var(--accent-glow);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
            background: rgba(139, 92, 246, 0.05);
            transform: scale(1.05);
        }

        .connector-line {
            height: 2px;
            width: 60px;
            background: var(--panel-border);
            position: relative;
        }
        
        .connector-line::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--panel-border);
            background: var(--bg-dark);
        }

        .fuse-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 3rem;
            font-size: 0.9rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            opacity: 0.3;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .fuse-btn.ready {
            opacity: 1;
            pointer-events: all;
            box-shadow: 0 0 40px var(--accent);
        }

        .fuse-btn:hover {
            transform: translateY(-2px);
            background: var(--accent-glow);
        }

        /* RIGHT: DEEP ANALYSIS */
        .analysis-content {
            padding: 0;
            overflow-y: auto;
            flex: 1;
            background: #0a0a0f;
        }

        .hud-header {
            padding: 1.5rem;
            background: linear-gradient(to bottom, rgba(139, 92, 246, 0.1), transparent);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            position: relative;
        }

        .hud-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .hud-subtitle {
            font-family: 'Courier New', monospace;
            color: var(--accent);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            opacity: 0.8;
        }

        .hud-body {
            padding: 1.5rem;
        }

        .hud-section {
            margin-bottom: 2rem;
        }

        .hud-section-title {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }

        .hud-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin-left: 1rem;
        }

        /* STAT BARS */
        .stat-bar-container {
            margin-bottom: 0.8rem;
        }

        .stat-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 0.3rem;
        }

        .stat-bar-track {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--accent);
        }

        /* HEX GRID FOR TAGS */
        .hex-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .hex-tag {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 4px 10px;
            font-size: 0.75rem;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        /* TERMINAL BOX */
        .terminal-box {
            background: #050508;
            border: 1px solid #333;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.6;
            position: relative;
        }

        .terminal-box::before {
            content: 'LOG_ENTRY_044';
            position: absolute;
            top: -8px;
            right: 10px;
            background: #050508;
            padding: 0 5px;
            font-size: 0.6rem;
            color: var(--text-dim);
        }

        /* VISUALIZER */
        .skill-visualizer {
            height: 120px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .skill-visualizer::after {
            content: '';
            position: absolute;
            width: 100%; height: 2px;
            background: rgba(139, 92, 246, 0.5);
            top: 50%;
            animation: scanline 3s infinite linear;
        }

        @keyframes scanline {
            0% { transform: translateY(-60px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(60px); opacity: 0; }
        }

        /* RESULT OVERLAY - ENHANCED SCHEMATIC */
        .result-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .result-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .result-content {
            width: 1100px;
            max-width: 95%;
            height: 90vh;
            background: #0f0f16;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            position: relative;
        }

        /* DECORATIVE CORNERS */
        .result-content::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100px; height: 100px;
            border-top: 2px solid var(--accent); border-left: 2px solid var(--accent);
            z-index: 10; pointer-events: none;
        }
        .result-content::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 100px; height: 100px;
            border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent);
            z-index: 10; pointer-events: none;
        }

        /* HEADER */
        .result-header {
            padding: 1.5rem 2rem;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-title-block h2 {
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, #fff, #94a3b8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-subtitle {
            font-family: 'Courier New', monospace;
            color: var(--accent);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* MAIN BODY GRID */
        .schematic-body {
            display: grid;
            grid-template-columns: 350px 1fr;
            overflow: hidden;
        }

        /* LEFT: CARD & CORE STATS */
        .schematic-sidebar {
            background: rgba(0,0,0,0.3);
            border-right: 1px solid var(--panel-border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .schematic-card {
            width: 100%;
            aspect-ratio: 3/4;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            padding: 1.5rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .schematic-card:hover {
            transform: translateY(-5px) scale(1.02);
        }

        .schematic-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
            margin: 6px;
        }

        .schematic-card.legendary { 
            border-color: #f59e0b; 
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.3); 
            background: linear-gradient(135deg, #451a03 0%, #0f172a 100%);
        }

        .schematic-card.legendary::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: sheen 4s infinite;
            pointer-events: none;
        }

        @keyframes sheen {
            0% { transform: translateX(-100%) rotate(45deg); }
            20% { transform: translateX(100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        
        .card-icon-large {
            font-size: 5rem;
            text-align: center;
            margin: 1rem 0;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
        }

        /* RIGHT: TABS & DETAILS */
        .schematic-main {
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.01);
        }

        .schematic-tabs {
            display: flex;
            border-bottom: 1px solid var(--panel-border);
        }

        .tab-btn {
            padding: 1rem 2rem;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            border-right: 1px solid var(--panel-border);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .tab-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .tab-btn.active { background: var(--accent); color: #fff; }

        .tab-content {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
            display: none;
        }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* CONTENT MODULES */
        .module-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .info-module {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--panel-border);
            padding: 1.5rem;
            border-radius: 4px;
        }

        .module-title {
            font-size: 0.8rem;
            color: var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        /* MASTERY TREE */
        .mastery-tree {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-top: 2rem;
        }

        .mastery-tree::before {
            content: ''; position: absolute; top: 20px; left: 0; right: 0; height: 2px;
            background: var(--panel-border); z-index: 0;
        }

        .mastery-node {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 30%;
        }

        .node-icon {
            width: 40px; height: 40px;
            background: #0f0f16;
            border: 2px solid var(--text-dim);
            border-radius: 50%;
            margin: 0 auto 1rem auto;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--text-dim);
        }

        .mastery-node.unlocked .node-icon {
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .node-desc { font-size: 0.8rem; color: #cbd5e1; line-height: 1.4; }

        /* FOOTER */
        .result-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            background: rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s;
        }
        .btn-primary:hover { background: var(--accent-glow); transform: translateX(2px); }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 0.8rem 2rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover { border-color: #fff; color: #fff; }

        /* MOBILE */
        @media (max-width: 850px) {
            .schematic-body { grid-template-columns: 1fr; }
            .schematic-sidebar { display: none; } /* Hide card on mobile for space */
            .module-grid { grid-template-columns: 1fr; }
        }


        /* MOBILE LANDSCAPE OPTIMIZATION */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 260px 1fr 300px;
            }
            .fusion-slot { width: 100px; height: 140px; }
            .connector-line { width: 40px; }
        }

        @media (max-width: 850px) {
            .container {
                grid-template-columns: 220px 1fr 0px; /* Hide analysis on small screens initially or make it overlay */
            }
            .panel:last-child { display: none; } /* Temporary hide for small screens */
            
            /* Adjust for landscape specifically */
            @media (orientation: landscape) {
                .container {
                    grid-template-columns: 200px 1fr 250px;
                }
                .panel:last-child { display: flex; }
                h1 { font-size: 1rem; }
                .fusion-slot { width: 90px; height: 120px; }
                .skill-item { padding: 0.5rem; }
                .result-content { padding: 1rem; gap: 1rem; }
                .result-title { font-size: 1.5rem; }
                .card-art-placeholder { height: 100px; font-size: 2rem; }
            }
        }

        /* ANIMATIONS */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); }

</head>
<body>

    <header>
        <h1>Fusion Laboratory</h1>
        <div style="display:flex; gap:1rem; align-items:center;">

                    <!-- Massive Tooltip Container (Grid Results) -->
                    <div id="massive-tooltip" class="massive-tooltip hidden">

    <!-- Load Skill Data Modules -->
    <script src="data/skills_foundational.js"></script>
    <script src="data/skills_invocation.js"></script>
    <script src="data/skills_character_analysis.js"></script>
    <script src="data/skills_consciousness.js"></script>
    <script src="data/skills_divination.js"></script>
    <script src="data/skills_singularity.js"></script>
    <script src="data/skills_tantra.js"></script>
    <script src="data/skills_therapeutic.js"></script>

    <script>
        // --- DEEP DATA DB ---
        // Initialize SKILL_DB by aggregating all loaded modules
        const SKILL_DB = [
            ...(window.SKILL_DB_FOUNDATIONAL || []).map(s => ({ ...(s || {}), engine: s && s.engine ? s.engine : 'Foundational' })),
            ...(window.SKILL_DB_INVOCATION || []).map(s => ({ ...(s || {}), engine: s && s.engine ? s.engine : 'Invocation' })),
            ...(window.SKILL_DB_CHARACTER_ANALYSIS || []).map(s => ({ ...(s || {}), engine: s && s.engine ? s.engine : 'Character' })),
            ...(window.SKILL_DB_CHARACTER || []).map(s => ({ ...(s || {}), engine: s && s.engine ? s.engine : 'Character' })),
            ...(window.SKILL_DB_CONSCIOUSNESS || []).map(s => ({ ...(s || {}), engine: s && s.engine ? s.engine : 'Consciousness' })),
            ...(window.SKILL_DB_DIVINATION || []).map(s => ({ ...(s || {}), engine: s && s.engine ? s.engine : 'Divination' })),
            ...(window.SKILL_DB_SINGULARITY || []).map(s => ({ ...(s || {}), engine: s && s.engine ? s.engine : 'Singularity' })),
            ...(window.SKILL_DB_TANTRA || []).map(s => ({ ...(s || {}), engine: s && s.engine ? s.engine : 'Tantra' })),
            ...(window.SKILL_DB_THERAPEUTIC || []).map(s => ({ ...(s || {}), engine: s && s.engine ? s.engine : 'Therapeutic' }))
        ];

        // Debug: Log sizes of module DBs to verify loading
        try {
            console.debug('SKILL_DB totals', SKILL_DB.length,
                'FOUNDATIONAL:', (window.SKILL_DB_FOUNDATIONAL || []).length,
                'INVOCATION:', (window.SKILL_DB_INVOCATION || []).length,
                'CHARACTER_ANALYSIS:', (window.SKILL_DB_CHARACTER_ANALYSIS || []).length,
                'CHARACTER:', (window.SKILL_DB_CHARACTER || []).length,
                'CONSCIOUSNESS:', (window.SKILL_DB_CONSCIOUSNESS || []).length,
                'DIVINATION:', (window.SKILL_DB_DIVINATION || []).length,
                'SINGULARITY:', (window.SKILL_DB_SINGULARITY || []).length,
                'TANTRA:', (window.SKILL_DB_TANTRA || []).length,
                'THERAPEUTIC:', (window.SKILL_DB_THERAPEUTIC || []).length
            );
        } catch (e) {
            console.debug('SKILL_DB debug log failed', e);
        }

        // --- AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'hover') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // --- STATE & SOURCE OF TRUTH (Step 1) ---
        // This page is the ORIGIN. It must construct the master list.
        
        let storedSkillsRaw = localStorage.getItem('cosmic_skills');
        let storedSkillsList = storedSkillsRaw ? JSON.parse(storedSkillsRaw) : [];

        // STRICT MERGE STRATEGY:
        // 1. Start with fresh Base Skills from Code (The Definitions)
        let knownSkills = [...SKILL_DB];

        // 2. Index the Stored Skills to recover player progress (Owned status)
        const storedMap = new Map(storedSkillsList.map(s => [s.id, s]));

        // 3. Hydrate Base Skills with Persistent Flags
        knownSkills = knownSkills.map(baseSkill => {
            const stored = storedMap.get(baseSkill.id);
            if (stored) {
                // Preserve 'owned' status if acquired
                if (stored.owned) baseSkill.owned = true;
            }
            return baseSkill;
        });

        // 4. Retrieve User-Created (Fused) Skills
        // identifying them by checking if they are NOT in the Base Set
        const baseIds = new Set(knownSkills.map(s => s.id));
        const userFusedSkills = storedSkillsList.filter(s => !baseIds.has(s.id));

        // 5. Combine: Base (Hydrated) + User Fused
        knownSkills = [...knownSkills, ...userFusedSkills];

        // 6. PERSIST: Establish the Source of Truth for Step 2
        console.log(`[Step 1 Origin] Stabilized ${knownSkills.length} skills (${userFusedSkills.length} fused). Source updated.`);
        localStorage.setItem('cosmic_skills', JSON.stringify(knownSkills));

        // Online/offline state per-skill (persisted)
        let onlineStateMap = JSON.parse(localStorage.getItem('cosmic_skill_online') || '{}');

        // Ensure any previously activated (online) skill is reflected as owned in knownSkills
        try {
            knownSkills.forEach(s => { if (onlineStateMap[s.id]) s.owned = true; });
            localStorage.setItem('cosmic_skills', JSON.stringify(knownSkills));
        } catch (e) { console.warn('Failed to sync online state to owned flag', e); }

        // Favorites State
        let favoriteSkills = new Set(JSON.parse(localStorage.getItem('cosmic_favorites') || '[]'));
        
        // History State
        let fusionHistory = JSON.parse(localStorage.getItem('cosmic_history') || '[]');

        // Engine Filter State
        let activeEngineFilter = null;

        function toggleFavorite(e, skillId) {
            e.stopPropagation(); // Prevent opening analysis
            if (favoriteSkills.has(skillId)) {
                favoriteSkills.delete(skillId);
            } else {
                favoriteSkills.add(skillId);
            }
            localStorage.setItem('cosmic_favorites', JSON.stringify([...favoriteSkills]));
            renderSkillList();
        }

        // Quick filters removed; legacy function removed to avoid accidental use.

        function setEngineFilter(engine) {
            activeEngineFilter = activeEngineFilter === engine ? null : engine;
            console.debug('Engine filter set to', activeEngineFilter);
            document.querySelectorAll('.engine-block').forEach(block => block.classList.remove('active'));
            if (activeEngineFilter) {

        // Engine categories shown on the filter row. These match the Card Creator clone's engine modules.
        const ENGINES = [
            { id: 'ALL', label: 'All', icon: '🌌' },
            { id: 'FUSED', label: 'Fused', icon: '⚡' },
            { id: 'Foundational', label: 'Foundational', icon: '🏛️' },
            { id: 'Invocation', label: 'Invocation', icon: '🔥' },
            { id: 'Tantra', label: 'Tantra', icon: '💧' },
            { id: 'Therapeutic', label: 'Therapeutic', icon: '🌿' },
            { id: 'Divination', label: 'Divination', icon: '🔮' },
            { id: 'Singularity', label: 'Singularity', icon: '⚫' },
            { id: 'Character', label: 'Character', icon: '🎭' },
            { id: 'Consciousness', label: 'Consciousness', icon: '🧠' }
        ];

        const ENGINE_ALIAS_MAP = {
            'character analysis': 'Character',
            'character': 'Character',
            'foundational': 'Foundational',
            'invocation': 'Invocation',
            'tantra': 'Tantra',
            'therapeutic': 'Therapeutic',
            'divination': 'Divination',
            'singularity': 'Singularity',
            'consciousness': 'Consciousness',
            'fused': 'Fused',
            'fusion': 'Fused'
        };

        function normalizeEngineAlias(name) {
            if (!name) return null;
            const n = String(name).trim().toLowerCase();
            return ENGINE_ALIAS_MAP[n] || null;
        }

        function getEngineForSkill(skill) {
            // Prefer explicit property if present
            if (skill.engine) return String(skill.engine).trim();
            if (skill._engine) {
                const normalized = normalizeEngineAlias(skill._engine);
                if (normalized) return normalized;
                return String(skill._engine).trim();
            }

            // Otherwise try to detect by checking the module arrays
            if (window.SKILL_DB_FOUNDATIONAL && window.SKILL_DB_FOUNDATIONAL.some(s => s.id === skill.id)) return 'Foundational';
            if (window.SKILL_DB_INVOCATION && window.SKILL_DB_INVOCATION.some(s => s.id === skill.id)) return 'Invocation';
            if (window.SKILL_DB_TANTRA && window.SKILL_DB_TANTRA.some(s => s.id === skill.id)) return 'Tantra';
            if (window.SKILL_DB_THERAPEUTIC && window.SKILL_DB_THERAPEUTIC.some(s => s.id === skill.id)) return 'Therapeutic';
            if (window.SKILL_DB_DIVINATION && window.SKILL_DB_DIVINATION.some(s => s.id === skill.id)) return 'Divination';
            if (window.SKILL_DB_SINGULARITY && window.SKILL_DB_SINGULARITY.some(s => s.id === skill.id)) return 'Singularity';
            if ((window.SKILL_DB_CHARACTER_ANALYSIS && window.SKILL_DB_CHARACTER_ANALYSIS.some(s => s.id === skill.id)) || (window.SKILL_DB_CHARACTER && window.SKILL_DB_CHARACTER.some(s => s.id === skill.id))) return 'Character';
            if (window.SKILL_DB_CONSCIOUSNESS && window.SKILL_DB_CONSCIOUSNESS.some(s => s.id === skill.id)) return 'Consciousness';

            // Not found — fallback to tag matching heuristics
            if (skill.tags) {
                const lowerTags = (skill.tags || []).map(t => String(t).toLowerCase());
                if (lowerTags.includes('void')) return 'Singularity';
                if (lowerTags.includes('solar') || lowerTags.includes('burn')) return 'Invocation';
                if (lowerTags.includes('nature')) return 'Therapeutic';
                if (lowerTags.includes('ice') || lowerTags.includes('stasis')) return 'Singularity';
                // Character heuristics (persona, profile, emotion, npc, social)
                if (lowerTags.includes('character') || lowerTags.includes('persona') || lowerTags.includes('profile') || lowerTags.includes('emotion') || lowerTags.includes('npc') || lowerTags.includes('social')) return 'Character';
            }
            return 'Unknown';
        }

        function skillMatchesEngine(skill, engine) {
            if (!engine || engine === 'ALL') return true;
            if (engine === 'FUSED') return !!((skill.fusionIngredients && skill.fusionIngredients.length) || skill.fused || skill.synthetic || skill.synthesized);

            // Exact engine field match
            if (skill.engine && String(skill.engine).toLowerCase() === String(engine).toLowerCase()) return true;
            if (skill._engine && String(skill._engine).toLowerCase() === String(engine).toLowerCase()) return true;

            // Module mapping
            const detected = getEngineForSkill(skill);
            if (detected && String(detected).toLowerCase() === String(engine).toLowerCase()) return true;

            // Tag match fallback
            if (skill.tags && skill.tags.some(t => String(t).toLowerCase() === String(engine).toLowerCase())) return true;
            if (skill.tags && skill.tags.some(t => String(t).toLowerCase().includes(String(engine).toLowerCase()))) return true;

            return false;
        }

                        count = knownSkills.filter(s => !!((s.fusionIngredients && s.fusionIngredients.length) || s.fused || s.synthetic || s.synthesized)).length;
                    } else {
                        count = knownSkills.filter(s => (s.engine && String(s.engine).toLowerCase() === String(engineObj.id).toLowerCase()) || skillMatchesEngine(s, engineObj.id)).length;
                    }
                } catch (e) { count = 0; }

        // (Auto-Merge Logic handled in initialization above)

        // Normalize knownSkills: retroactively mark fused skills and assign engine when obvious.
        function normalizeSkillFlags() {
            (knownSkills || []).forEach(s => {
                try {
                    if (s && typeof s.id === 'string' && s.id.startsWith('fusion_')) {
                        if (!s.fused) s.fused = true;
                        if (!s.origin) s.origin = 'fusion';
                        if (!s.engine) s.engine = 'FUSED';
                    }
                    // Ensure tags exist
                    s.tags = s.tags || [];
                    const lowerTags = (s.tags || []).map(t => String(t).toLowerCase());
                    if (!s.engine && (lowerTags.includes('character') || lowerTags.includes('persona') || lowerTags.includes('profile') || lowerTags.includes('npc'))) {
                        s.engine = 'Character';
                    }
                    // If still missing engine, try detect via module arrays
                    if (!s.engine) {
                        const detected = getEngineForSkill(s);
                        if (detected && detected !== 'Unknown') s.engine = detected;
                    }
                } catch (e) { /* ignore malformed skill */ }
            });
            // Persist normalized flags back to localStorage
            try { localStorage.setItem('cosmic_skills', JSON.stringify(knownSkills)); } catch (e) { console.warn('Failed to persist normalized knownSkills', e); }
        }
        normalizeSkillFlags();

            // Ensure any skill entries loaded from SKILL_DB are given engine property if missing (also persist to storage)
        function applyEngineToSeededDB() {
            (SKILL_DB || []).forEach(s => {
                try {
                    if (s && !s.engine) {
                        const detected = getEngineForSkill(s);
                        if (detected && detected !== 'Unknown') s.engine = detected;
                    }
                } catch (e) { /* ignore */ }
            });
        }
        applyEngineToSeededDB();
        
        // One-time migration: persist engine assignments on persisted skills
        function runOneTimeEngineMigration() {
            const FLAG = 'cosmic_engine_migration_v1';
            if (localStorage.getItem(FLAG)) {
                console.debug('Engine migration already applied');
                return;
            }
            console.debug('Running one-time engine migration...');
            let changed = false;
            (knownSkills || []).forEach(s => {
                try {
                    if (!s) return;
                    const before = s.engine || s._engine || null;
                    // Normalize _engine if present
                    if (s._engine && !s.engine) {
                        const norm = normalizeEngineAlias(s._engine);
                        s.engine = norm || s._engine;
                    }
                    // Fused detection
                    if ((s.fusionIngredients && s.fusionIngredients.length) || s.fused || s.synthetic || s.synthesized || (s.id && String(s.id).startsWith('fusion_'))) {
                        if (s.engine !== 'FUSED') s.engine = 'FUSED';
                    }
                    // If still missing engine, detect via module arrays and tags
                    if (!s.engine) {
                        const detected = getEngineForSkill(s);
                        if (detected && detected !== 'Unknown') s.engine = detected;
                    }
                    if ((before || null) !== (s.engine || null)) changed = true;
                } catch (e) { /* ignore */ }
            });
            if (changed) {
                try {
                    localStorage.setItem('cosmic_skills', JSON.stringify(knownSkills));
                    console.debug('Engine migration applied and changes persisted');
                } catch (e) { console.warn('Engine migration: failed to persist', e); }
            } else {
                console.debug('Engine migration: no changes necessary');
            }
            // Apply to seeded DB too
            try { applyEngineToSeededDB(); } catch (e) { /* ignore */ }
            localStorage.setItem(FLAG, '1');
        }

            const sortMode = document.getElementById('sort-select') ? document.getElementById('sort-select').value : 'tier';
            let displaySkills = [...knownSkills];
            // If the user typed a query, rank and restrict by semantic search
            if (filter) {
                const ranked = semanticSearch(filter, { selectedTags });
                if (ranked && ranked.length) {
                    // Use ranked skills directly
                    displaySkills = ranked;
                } else {
                    // else leave displaySkills empty to show nothing
                    displaySkills = [];

            // Legacy quick filters removed. Use tag chips and engine filters instead.

        function generateTechnicalData(skill) {
            // Procedural generation of "deep" stats
            const isMelee = skill.tags.includes('MELEE');
            const isArea = skill.gameplay_info.usage[1].includes('Area') || skill.description.includes('radius') || skill.tags.includes('NOVA');
            
            // Calculate Efficiency
            const val = skill.stats.damage || skill.stats.heal || 0;
            const cost = skill.stats.cost || 1;
            const cd = skill.stats.cooldown || 1;
            
            const dpe = (val / cost).toFixed(1);
            const dps_rating = (val / cd).toFixed(1);

            return {
                specs: [
                    { label: "Activation", val: isMelee ? "Instant" : "0.5s Cast" },
                    { label: "Targeting", val: isArea ? "Ground Target (AOE)" : "Unit Target (Lock-on)" },
                    { label: "Effective Range", val: isMelee ? "2.5 Meters" : "18 Meters" },
                    { label: "Duration", val: "Instant" } 
                ],
                efficiency: [
                    { label: "Damage Efficiency", val: `${dpe} Dmg/Energy` },
                    { label: "Burst Rating", val: `${dps_rating} DPS` },
                    { label: "Threat Generation", val: skill.stats.damage > 20 ? "High" : "Low" }
                ],
                mechanics_text: `This skill utilizes a <strong>${isMelee ? 'Physical' : 'Magical'}</strong> coefficient. It benefits from <strong>${skill.tags[0]} Mastery</strong> and triggers on-hit effects at <strong>${isArea ? '50%' : '100%'}</strong> effectiveness.`
            };
        }

            if (skill.tags.includes('NATURE')) return '🌿';
            if (skill.tags.includes('ICE') || skill.tags.includes('STASIS')) return '❄️';
            if (skill.tags.includes('BLOOD') || skill.tags.includes('DECAY')) return '🩸';
            if (skill.tags.includes('STORM')) return '⚡';
            
            // Structural / Foundational
            if (skill.tags.includes('STRUCTURE')) return '🏗️';
            if (skill.tags.includes('SUPPORT')) return '🤝';
            if (skill.tags.includes('FIELD')) return '🛡️';
            
            // Tantra / Control
            if (skill.tags.includes('DISCORD')) return '🎭';
            if (skill.tags.includes('SUBSERVIENCE')) return '⛓️';
            if (skill.tags.includes('BANISH')) return '🚫';
            if (skill.tags.includes('SILENCE')) return '🔇';
            if (skill.tags.includes('STUN')) return '💫';
            
            // Analysis / Mind
            if (skill.tags.includes('ANALYSIS')) return '👁️';
            if (skill.tags.includes('MIND') || skill.tags.includes('PSYCHE')) return '🧠';
            if (skill.tags.includes('HEAL')) return '💚';

    function renderTagChips() {
        const container = document.getElementById('tag-chips-container');
        if (!container) return;

        // Collect all tags and count frequency
        const tagCounts = {};
        knownSkills.forEach(skill => {
            if (skill.tags && Array.isArray(skill.tags)) {
                skill.tags.forEach(tag => {
                    tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                });
            }
        });

        // Sort by count desc
        const sortedTags = Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]);

        container.innerHTML = sortedTags.map(tag => {
            const isActive = selectedTags.has(tag);
            return `
                <div class="tag-chip ${isActive ? 'active' : ''}" onclick="toggleTag('${tag}')">
                    ${tag} <span class="count">${tagCounts[tag]}</span>
                </div>
            `;
        }).join('');

    function tokenizeText(text) {
        if (!text) return [];
        return String(text).toLowerCase().split(/[^\w\-]+/).filter(Boolean).map(t => t.trim());
    }

    function buildSearchIndex() {
        if (!knownSkills || knownSkills.length === 0) return;

        const docFreq = {};
        const tokensPerDoc = [];
        const weights = {
            name: 3.0,
            tags: 2.5,
            type: 1.8,
            tier: 1.5,
            tactical: 1.2,
            description: 1.0,
            lore: 0.8,
            engine: 1.0
        };

        // Build raw token frequency * weight per document
        knownSkills.forEach(skill => {
            const tokenScores = {};

            // Helper to add field tokens
            const addTokens = (text, w) => {
                tokenizeText(text).forEach(tok => {
                    // expand synonyms
                    const canonical = SYNONYMS[tok] || tok;
                    tokenScores[canonical] = (tokenScores[canonical] || 0) + w;
                });
            };

            // compute scores
            addTokens(skill.name, weights.name);
            addTokens((skill.tags || []).join(' '), weights.tags);
            addTokens(skill.type, weights.type);
            addTokens(skill.tier, weights.tier);
            addTokens(skill.tactical_brief, weights.tactical);
            addTokens(skill.description, weights.description);
            addTokens(skill.lore_quote, weights.lore);
            addTokens(skill.engine, weights.engine);

            // record docFreq
            Object.keys(tokenScores).forEach(tok => {
                docFreq[tok] = (docFreq[tok] || 0) + 1;
            });
            tokensPerDoc.push({id: skill.id, tokenScores, skill});
        });

        // Now convert to IDF & normalized scores
        const N = tokensPerDoc.length || 1;
        searchIndex = tokensPerDoc.map(doc => {
            const tokenScores = {};
            let norm = 0;
            Object.entries(doc.tokenScores).forEach(([tok, tf]) => {
                const idf = Math.log(1 + N / (docFreq[tok] || 1));
                const val = tf * idf;
                tokenScores[tok] = val;
                norm += val * val;
            });
            norm = Math.sqrt(norm) || 1;
            return { id: doc.id, skill: doc.skill, tokenScores, norm };
        });

        console.log(`Indexed ${searchIndex.length} skills (TF-IDF with weights).`);
    }

    function handleSearchInput() {
        const searchInput = document.getElementById('smart-search-input');
        const searchClearBtn = document.getElementById('search-clear-btn');
        const massiveTooltip = document.getElementById('massive-tooltip');

        const query = searchInput.value.trim().toLowerCase();
        
        if (query.length > 0) {
            searchClearBtn.classList.remove('hidden');
        } else {
            searchClearBtn.classList.add('hidden');
            massiveTooltip.classList.add('hidden');
            renderSkillList();
            return;
        }

        const results = semanticSearch(query, { selectedTags });
        renderMassiveTooltip(results);
        renderSkillList(); 
    }

    function semanticSearch(rawQuery, options = {}) {
        if (!searchIndex.length) buildSearchIndex();
        const q = String(rawQuery || '').toLowerCase();
        if (!q) return [];
        const tokens = tokenizeText(q).map(t => SYNONYMS[t] || t).filter(Boolean);
        if (!tokens.length) return [];

        const scores = searchIndex.map(doc => {
            let s = 0;
            tokens.forEach(tok => {
                if (doc.tokenScores && doc.tokenScores[tok]) s += doc.tokenScores[tok];
                // also check prefix matches for single tokens
                for (const [dt, val] of Object.entries(doc.tokenScores || {})) {
                    if (dt.startsWith(tok) && dt.length > tok.length) s += val * 0.25; // partial match
                }
            });
            // normalize by doc norm
            s = s / doc.norm;
            // personalization boosts
            if (favoriteSkills && favoriteSkills.has && favoriteSkills.has(doc.skill.id)) s *= 1.15;
            if (activeEngineFilter && doc.skill.engine && String(doc.skill.engine).toLowerCase() === String(activeEngineFilter).toLowerCase()) s *= 1.1;
            if (selectedTags && selectedTags.size) {
                const matches = Array.from(selectedTags).filter(t => (doc.skill.tags||[]).includes(t));
                if (matches.length) s *= 1 + (matches.length * 0.08);
            }
            return { id: doc.id, skill: doc.skill, score: s };
        }).filter(r => r.score > 0);

        // Optionally apply tag filters (AND semantics)
        if (options.selectedTags && options.selectedTags.size) {
            const sel = options.selectedTags;
            return scores.filter(r => {
                const tags = r.skill.tags || [];
                return Array.from(sel).every(t => tags.includes(t));
            }).map(r => r.skill);
        }

        // sort
        scores.sort((a,b) => b.score - a.score);
        return scores.map(r => r.skill);
    }

    // Tooltip keyboard selection state
    let selectedTooltipIndex = -1;

    function selectNextTooltipItem(step) {
        const tooltipGrid = document.getElementById('tooltip-grid');
        if (!tooltipGrid) return;
        const items = Array.from(tooltipGrid.querySelectorAll('.tooltip-item'));
        if (!items.length) return;
        selectedTooltipIndex = (selectedTooltipIndex + step + items.length) % items.length;
        updateTooltipSelection(items);
    }

    function updateTooltipSelection(items) {
        items.forEach((el, idx) => {
            if (idx === selectedTooltipIndex) {
                el.classList.add('selected');
                el.scrollIntoView({block:'nearest'});
            } else {
                el.classList.remove('selected');
            }
        });
    }

    function renderMassiveTooltip(skills) {
        const massiveTooltip = document.getElementById('massive-tooltip');
        const tooltipGrid = document.getElementById('tooltip-grid');

        if (skills.length === 0) {
            massiveTooltip.classList.add('hidden');
            return;
        }

        massiveTooltip.classList.remove('hidden');
        const limit = 12;
        const displaySkills = skills.slice(0, limit);
        
        document.querySelector('.tooltip-count').textContent = `${skills.length} matches`;
        
        tooltipGrid.innerHTML = displaySkills.map(skill => `
            <div class="tooltip-item" onclick="selectSkillFromTooltip('${skill.id}')" data-skill-id="${skill.id}">
                <div style="display:flex; justify-content:space-between; gap:8px; align-items:center;">
                    <div style="flex:1; min-width:0;">
                        <div class="tooltip-item-name">${skill.name}</div>
                        <div class="tooltip-item-meta">
                            <span>${skill.type}</span>
                            <span style="color:${getTierColor(skill.tier)}">${skill.tier}</span>
                        </div>
                    </div>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <button class="search-action-btn" title="Favorite" onclick="event.stopPropagation(); toggleFavorite(event, '${skill.id}')">★</button>
                        <button class="search-action-btn" title="Inspect" onclick="event.stopPropagation(); quickInspect('${skill.id}')">🔎</button>
                        <button class="search-action-btn" title="Suggest" onclick="event.stopPropagation(); quickSuggest('${skill.id}')">⚡</button>
                    </div>
                </div>
            </div>
        `).join('');
        // Reset keyboard selection
        selectedTooltipIndex = 0;
        const items = Array.from(tooltipGrid.querySelectorAll('.tooltip-item'));
        updateTooltipSelection(items);
    }

    function selectSkillFromTooltip(skillId) {
        const searchInput = document.getElementById('smart-search-input');
        const massiveTooltip = document.getElementById('massive-tooltip');
        
        const skill = knownSkills.find(s => s.id === skillId);
        if (skill) {
            searchInput.value = skill.name;
            massiveTooltip.classList.add('hidden');
            renderSkillList();
        }
    }

    function quickInspect(id) {
        const skill = knownSkills.find(s => s.id === id);
        if (skill) {
            showAnalysis(skill);
        }
    }

    function quickSuggest(id) {
        const skill = knownSkills.find(s => s.id === id);
        if (skill) {
            Bloodsage.context.lastSkill = skill;
            renderBlocksAsChat([Bloodsage._getSuggestBlock({}, skill.name)]);
        }
    }

    function getTierColor(tier) {
        switch(tier) {
            case 'S': return '#f59e0b';
            case 'A': return '#a855f7';
            case 'B': return '#3b82f6';
            default: return '#94a3b8';
        }
    }

    // Initialize Smart Search
    setTimeout(initSmartSearch, 1000); 
    </script>
</body>
</html>
