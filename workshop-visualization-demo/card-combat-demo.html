            },
            yoga: {
                'Fusion Harmony': { category: 'Synergy', desc: 'Multiple fusion abilities activate simultaneously, creating cascading effects that multiply your power beyond the sum of individual skills.' },
                'Tactical Flexibility': { category: 'Synergy', desc: 'High versatility enables adaptive combat strategies. This card excels in unpredictable battles where situational awareness determines victory.' },
                'Maximum Efficiency': { category: 'Synergy', desc: 'Perfect resource optimization demonstrates mastery of card construction. Every KP point and house slot contributes to a harmonious whole.' },
                'Overwhelming Force': { category: 'Synergy', desc: 'Exceptional power concentration creates decisive combat moments. This card can single-handedly turn battles with properly timed deployment.' },
                'Tempo Mastery': { category: 'Synergy', desc: 'Balanced cooldowns maintain consistent combat rhythm. Neither too slow to respond nor too fast to sustain, achieving perfect tactical flow.' }
            }
        };
        
        // Show tooltip modal
        function showTooltip(type, term) {
            let title, category, content;
            
            if (type === 'skill') {
                // Handle skill tooltips
                const skill = currentSkillData[term];
                if (!skill) {
                    console.log('Skill not found:', term);
                    return;
                }
                
                title = skill.name;
                category = `${skill.cooldown >= 3 ? '🔥 Active' : '💎 Passive'} Skill • ${skill.cooldown}s Cooldown`;
                
                // Build combat explanation
                const powerLevel = skill.power < 100 ? 'Low' : skill.power < 200 ? 'Medium' : skill.power < 300 ? 'High' : 'Extreme';
                const combatUse = skill.cooldown === 0 ? 'Instant' : 
                                 skill.cooldown <= 2 ? 'Fast Rotation' : 
                                 skill.cooldown <= 4 ? 'Regular Combat' : 'Ultimate Ability';
                
                content = `
                    <div style="background: rgba(139,92,246,0.2); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #8b5cf6;">
                        <strong style="font-size: 1.15em; color: #00e3d6;">💫 What This Skill Does In Combat:</strong><br>
                        <div style="margin-top: 10px; line-height: 1.7; font-size: 1.05em;">
                            ${getSkillCombatEffect(skill)}
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                        <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px;">
                            <div style="opacity: 0.7; font-size: 0.85em;">⚡ Power</div>
                            <div style="font-size: 1.3em; font-weight: bold; color: #ffd700;">${skill.power}</div>
                            <div style="opacity: 0.7; font-size: 0.8em; margin-top: 2px;">${powerLevel} Impact</div>
                        </div>
                        <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px;">
                            <div style="opacity: 0.7; font-size: 0.85em;">⏱️ Type</div>
                            <div style="font-size: 1.1em; font-weight: bold; color: #00e3d6;">${combatUse}</div>
                            <div style="opacity: 0.7; font-size: 0.8em; margin-top: 2px;">${skill.cooldown}s wait</div>
                        </div>
                    </div>
                    
                    ${skill.houseBonus !== 1.0 ? `
                    <div style="background: rgba(255,215,0,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,215,0,0.3); margin-bottom: 15px;">
                        <strong>🏠 House Bonus Applied:</strong><br>
                        <div style="margin-top: 5px;">Base ${skill.originalPower} power → <span style="color: #ffd700; font-weight: bold;">${skill.power}</span> (×${skill.houseBonus} from ${skill.house})</div>
                    </div>` : `
                    <div style="background: rgba(0,227,214,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(0,227,214,0.3); margin-bottom: 15px;">
                        <strong>🏠 Slotted In:</strong> ${skill.house}
                    </div>`}
                    
                    <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                        <strong>🏷️ Keywords:</strong><br>
                        <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px;">
                            ${skill.keywords.map(kw => {
                                const tagData = TAG_DATA[kw.toLowerCase()] || { icon: '🔖', color: '#8b5cf6' };
                                return `<span style="background: ${tagData.color}33; color: ${tagData.color}; padding: 4px 10px; border-radius: 4px; border: 1px solid ${tagData.color}80; font-size: 0.9em;">${tagData.icon} ${kw}</span>`;
                            }).join('')}
                        </div>
                    </div>
                    
                    <div style="margin-top: 15px; padding: 15px; background: linear-gradient(135deg, rgba(100,149,237,0.15), rgba(138,43,226,0.15)); border-radius: 8px; border-left: 4px solid #6495ed;">
                        <strong style="color: #87ceeb; font-size: 1.1em;">💡 How To Use This In Battle:</strong><br>
                        <div style="margin-top: 8px; line-height: 1.6;">
                            ${getSkillUsageTip(skill)}
                        </div>
                    </div>
                `;
            } else if (type === 'fusion') {
                // Handle fusion tooltips
                const fusion = currentCard?.synergies?.[term];
                if (!fusion) {
                    console.log('Fusion not found:', term);
                    return;
                }
                
                title = `${fusion.icon} ${fusion.name}`;
                category = `${fusion.tier} Tier Fusion Synergy`;
                
                const tierColor = TIER_COLORS[fusion.tier]?.color || '#8b5cf6';
                
                content = `
                    <div style="background: linear-gradient(135deg, rgba(138,43,226,0.2), rgba(75,0,130,0.2)); padding: 18px; border-radius: 10px; margin-bottom: 15px; border: 2px solid ${tierColor};">
                        <strong style="font-size: 1.2em; color: ${tierColor};">⚗️ Fusion Combat Effect:</strong><br>
                        <div style="margin-top: 12px; font-size: 1.05em; line-height: 1.8;">
                            ${fusion.description}
                        </div>
                    </div>
                    
                    ${fusion.pattern ? `
                    <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                        <strong>🔮 How To Trigger:</strong><br>
                        <div style="margin-top: 6px; color: #ffd700; font-size: 1.05em;">${fusion.pattern}</div>
                        <div style="margin-top: 6px; opacity: 0.8; font-size: 0.9em;">This fusion activates automatically when the pattern is met in your card</div>
                    </div>` : ''}
                    
                    ${fusion.multiplier > 1 ? `
                    <div style="background: rgba(255,215,0,0.15); padding: 15px; border-radius: 8px; border: 2px solid rgba(255,215,0,0.4); margin-bottom: 15px;">
                        <strong style="color: #ffd700; font-size: 1.1em;">✨ Power Multiplier:</strong><br>
                        <div style="font-size: 1.5em; font-weight: bold; color: #ffd700; margin-top: 8px;">×${fusion.multiplier} EFFECT BOOST!</div>
                        <div style="margin-top: 8px; opacity: 0.95; font-size: 1.05em;">All skills involved in this fusion deal <strong style="color: #ffd700;">${fusion.multiplier}× their normal damage/healing/effects</strong>. This is HUGE!</div>
                    </div>` : ''}
                    
                    <div style="margin-top: 15px; padding: 15px; background: linear-gradient(135deg, rgba(100,149,237,0.15), rgba(138,43,226,0.15)); border-radius: 8px; border-left: 4px solid #6495ed;">
                        <strong style="color: #87ceeb; font-size: 1.1em;">💡 Strategic Battle Use:</strong><br>
                        <div style="margin-top: 8px; line-height: 1.6;">
                            ${getFusionUsageTip(fusion)}
                        </div>
                    </div>
                `;
            } else if (type === 'keyword') {
                // Handle keyword tooltips using comprehensive KEYWORD_TOOLTIPS
                const normalizedTerm = term.charAt(0).toUpperCase() + term.slice(1).toLowerCase();
                const tooltipText = KEYWORD_TOOLTIPS[normalizedTerm] || KEYWORD_TOOLTIPS[term] || KEYWORD_TOOLTIPS[term.toUpperCase()];
                
                title = term.toUpperCase();
                category = 'Keyword';
                
                if (tooltipText) {
                    // We have a defined tooltip
                    content = `
                        <div style="background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(100,180,255,0.2)); padding: 18px; border-radius: 10px; margin-bottom: 15px; border: 2px solid #8b5cf6;">
                            <strong style="font-size: 1.2em; color: #ba55d3;">📖 What This Keyword Means:</strong><br>
                            <div style="margin-top: 12px; font-size: 1.1em; line-height: 1.8;">
                                ${tooltipText}
                            </div>
                        </div>
                        
                        <div style="background: rgba(100,149,237,0.1); padding: 15px; border-radius: 8px; border-left: 4px solid #6495ed; margin-bottom: 15px;">
                            <strong style="color: #87ceeb; font-size: 1.1em;">💡 How It's Used In This Card:</strong><br>
                            <div style="margin-top: 10px; line-height: 1.6;">
                                ${getKeywordUsageInCard(term)}
                            </div>
                        </div>
                        
                        ${getKeywordCombatTips(term)}
                    `;
                } else {
                    // Fallback for undefined keywords
                    const tagData = TAG_DATA[term.toLowerCase()] || { icon: '🔖', color: '#8b5cf6' };
                    content = `
                        <div style="background: rgba(139,92,246,0.15); padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                            <div style="font-size: 1.05em; line-height: 1.7; margin-bottom: 10px;">
                                <strong>${term.toUpperCase()}</strong> is a keyword that appears in your card's skills. Keywords determine fusion potential, tactical advantages, and combo opportunities.
                            </div>
                        </div>
                        
                        <div style="background: rgba(100,149,237,0.1); padding: 15px; border-radius: 8px; border-left: 4px solid #6495ed;">
                            <strong style="color: #87ceeb; font-size: 1.1em;">💡 In This Card:</strong><br>
                            <div style="margin-top: 10px;">
                                ${getKeywordUsageInCard(term)}
                            </div>
                        </div>
                    `;
                }
            } else if (type === 'dosha' || type === 'yoga') {
                // Handle dosha/yoga tooltips
                const data = TOOLTIP_DATA[type]?.[term];
                if (!data) {
                    console.log('No tooltip data for:', type, term);
                    return;
                }
                title = term;
                category = data.category;
                content = data.desc;
            } else {
                console.log('Unknown tooltip type:', type);
                return;
            }
            
            const overlay = document.getElementById('tooltipOverlay') || createTooltipElements();
            const modal = document.getElementById('tooltipModal');
            
            document.getElementById('tooltipTitle').innerHTML = title;
            document.getElementById('tooltipCategory').textContent = category;
            document.getElementById('tooltipContent').innerHTML = content;
            
            overlay.classList.add('active');
            modal.classList.add('active');
        }
        
        // Hide tooltip
        function hideTooltip() {
            document.getElementById('tooltipOverlay')?.classList.remove('active');
            document.getElementById('tooltipModal')?.classList.remove('active');
        }
        
        // Create tooltip elements
        function createTooltipElements() {
            const overlay = document.createElement('div');
            overlay.id = 'tooltipOverlay';
            overlay.className = 'tooltip-overlay';
            overlay.onclick = hideTooltip;
            
            const modal = document.createElement('div');
            modal.id = 'tooltipModal';
            modal.className = 'tooltip-modal';
            modal.innerHTML = `
                <div class="tooltip-header">
                    <div class="tooltip-title" id="tooltipTitle"></div>
                    <div class="tooltip-close" onclick="hideTooltip()">×</div>
                </div>
                <div class="tooltip-category" id="tooltipCategory"></div>
                <div class="tooltip-content" id="tooltipContent"></div>
            `;
            
            document.body.appendChild(overlay);
            document.body.appendChild(modal);
            
            return overlay;
        }
        
        // Generate skill combat effect description
        function getSkillCombatEffect(skill) {
            // First try to get the actual effect from the skill database
            let fullSkillData = SKILL_DATABASE[skill.name];
            
            // Try normalized name if exact match fails
            if (!fullSkillData) {
                const normalizedName = skill.name.trim().toLowerCase();
                fullSkillData = SKILL_DATABASE[normalizedName];
            }
            
            // If still not found, check if the skill object itself has effect/description data from the workshop
            if (!fullSkillData && skill.effect) {
                console.log(`💡 Using skill data from card itself: ${skill.name}`);
                fullSkillData = skill; // Use the skill data that was saved with the card
            }
            
            // Debug logging
            if (!fullSkillData) {
                console.warn(`⚠️ Skill "${skill.name}" not found in database or card data`);
            } else {
                console.log(`✅ Found skill data for "${skill.name}"`);
            }
            
            if (fullSkillData) {
                // Use description field (full effect) or effects array or effect field
                const effectText = fullSkillData.description || 
                                 fullSkillData.effect || 
                                 (fullSkillData.effects ? fullSkillData.effects.join('<br>') : null);
                
                if (effectText) {
                    console.log('📜 Using real effect from database/card for:', skill.name);
                    // Clean up the text and format it nicely
                    let formattedEffect = effectText
                        .replace(/\*\*/g, '<strong>')
                        .replace(/\r\n/g, '<br>')
                        .replace(/\n/g, '<br>')
                        .replace(/\[HYBRID\]/g, '<span style="color: #ba55d3; font-weight: bold;">[HYBRID FUSION]</span>')
                        .replace(/\[Structure\]/g, '<span style="color: #8b5cf6;">[Structure]</span>')
                        .replace(/\[Field\]/g, '<span style="color: #64b4ff;">[Field]</span>');
                    
                    return `<div style="margin-left: 10px; line-height: 1.8; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border-left: 3px solid #00e3d6;">${formattedEffect}</div>`;
                }
            }
            
            console.warn('⚠️ Falling back to generated effect for:', skill.name);
            
            // Fallback: generate effect from keywords (if database not loaded or skill not found)
            const keywords = skill.keywords.map(k => k.toLowerCase());
            const power = skill.power;
            
            let effects = [];
            
            // Determine primary effect based on keywords
            if (keywords.includes('damage')) {
                effects.push(`<strong style="color: #ff6464;">Deals ${power} damage</strong> to target enemy`);
            }
            if (keywords.includes('heal')) {
                effects.push(`<strong style="color: #64ff96;">Restores ${Math.round(power * 0.8)} HP</strong> to ally or self`);
            }
            if (keywords.includes('buff')) {
                effects.push(`<strong style="color: #c896ff;">Grants +${Math.round(power * 0.15)}% stat boost</strong> for ${Math.ceil(skill.cooldown * 0.5) || 2} turns`);
            }
            if (keywords.includes('debuff')) {
                effects.push(`<strong style="color: #ff9664;">Inflicts -${Math.round(power * 0.15)}% penalty</strong> on enemy for ${Math.ceil(skill.cooldown * 0.5) || 2} turns`);
            }
            if (keywords.includes('support')) {
                effects.push(`<strong style="color: #96ffeb;">Provides ${Math.round(power * 0.1)} shield</strong> or utility effect to allies`);
            }
            
            // Element-specific additional effects
            if (keywords.includes('fire')) {
                effects.push(`🔥 Burns target for <strong style="color: #ff6464;">${Math.round(power * 0.25)} damage per turn</strong> (3 turns)`);
            }
            if (keywords.includes('ice')) {
                effects.push(`❄️ <strong style="color: #64b4ff;">Slows target by 35%</strong>, may freeze for 1 turn`);
            }
            if (keywords.includes('lightning')) {
                effects.push(`⚡ Can <strong style="color: #ffeb64;">chain to 2 nearby enemies</strong> for 50% damage each`);
            }
            if (keywords.includes('water')) {
                effects.push(`💧 Cleanses 1 debuff and <strong style="color: #64c8ff;">heals ${Math.round(power * 0.35)} extra</strong>`);
            }
            if (keywords.includes('earth')) {
                effects.push(`🌍 Grants <strong style="color: #96c864;">+${Math.round(power * 0.2)} armor</strong> for 2 turns, blocks status effects`);
            }
            if (keywords.includes('dark')) {
                effects.push(`🌑 <strong style="color: #9664c8;">Drains ${Math.round(power * 0.35)} life</strong>, curses target (-10% healing received)`);
            }
            if (keywords.includes('light')) {
                effects.push(`☀️ Purifies all allies and deals <strong style="color: #ffe664;">+50% bonus damage to cursed/dark enemies</strong>`);
            }
            
            // If no specific effects detected, provide generic power-based description
            if (effects.length === 0) {
                effects.push(`Activates with <strong style="color: #ffd700;">${power} power</strong> based on house position and card synergies. Effect scales with fusion bonuses.`);
            }
            
            return '<div style="margin-left: 10px;">• ' + effects.join('<br>• ') + '</div>';
        }
        
        // Generate usage tip for skill
        function getSkillUsageTip(skill) {
            const cd = skill.cooldown;
            const keywords = skill.keywords.map(k => k.toLowerCase());
            const power = skill.power;
            
            let tip = '';
            
            if (cd === 0) {
                tip = `This skill is <strong style="color: #00e3d6;">always active</strong> or has instant cast. No waiting! Use it freely to maintain pressure.`;
            } else if (cd <= 2) {
                tip = `<strong style="color: #00e3d6;">Fast cooldown</strong> allows frequent use every ${cd} second${cd > 1 ? 's' : ''}. Perfect for maintaining combo chains and consistent damage output.`;
            } else if (cd <= 4) {
                tip = `<strong style="color: #ffeb64;">Moderate cooldown</strong> (${cd}s) requires tactical timing. `;
                if (keywords.includes('damage')) tip += 'Save for when enemy defenses are down or to secure kills.';
                else if (keywords.includes('heal')) tip += 'Reserve for critical moments when allies need emergency recovery.';
                else tip += 'Deploy when maximum impact is guaranteed.';
            } else {
                tip = `<strong style="color: #ff6464;">Long cooldown</strong> (${cd}s) makes this an <strong>ULTIMATE ABILITY</strong>. Only use at game-changing moments: `;
                if (keywords.includes('damage') && power >= 200) tip += 'finishing blows on weakened enemies or boss battles.';
                else if (keywords.includes('heal')) tip += 'desperate team saves or turning the tide when losing.';
                else tip += 'critical turning points that decide victory or defeat.';
            }
            
            // Add tactical context based on keywords
            if (keywords.includes('fire') || keywords.includes('damage')) {
                tip += `<br><br><strong>⚔️ Offensive Use:</strong> Combine with other damage dealers for burst combos. ${keywords.includes('fire') ? 'DoT (Damage over Time) stacks with repeated applications!' : ''}`;
            }
            if (keywords.includes('heal') || keywords.includes('support')) {
                tip += `<br><br><strong>🛡️ Defensive Use:</strong> Keep allies healthy to sustain long battles. Don't wait until it's too late - heal proactively!`;
            }
            if (keywords.includes('buff')) {
                tip += `<br><br><strong>✨ Enhancement Use:</strong> Apply before major attacks to amplify damage. Stack multiple buffs for exponential power gains!`;
            }
            
            return tip;
        }
        
        // Generate fusion usage tip
        function getFusionUsageTip(fusion) {
            const tier = fusion.tier;
            const mult = fusion.multiplier || 1;
            
            let tip = '';
            
            if (tier === 'Legendary') {
                tip = `This is a <strong style="color: #ff8800;">GAME-CHANGING</strong> fusion! `;
                if (mult >= 3) tip += `With <strong>×${mult} multiplier</strong>, it can OBLITERATE enemies or save entire battles. `;
                tip += `Activates automatically when pattern requirements are met. Can single-handedly turn impossible situations into victories. `;
                tip += `<br><br><strong>🎯 Pro Strategy:</strong> Build your entire deck strategy around reliably triggering this fusion. It's worth it!`;
            } else if (tier === 'Epic') {
                tip = `<strong style="color: #ff6496;">Powerful synergy</strong> that significantly amplifies your combat effectiveness. `;
                if (mult >= 2) tip += `The ×${mult} multiplier makes this incredibly impactful - `;
                tip += `Plan your card construction to consistently trigger this pattern. `;
                tip += `<br><br><strong>🎯 Usage:</strong> This fusion gives you a major edge. Opponents won't expect the sudden power spike!`;
            } else if (tier === 'Rare') {
                tip = `Solid fusion providing <strong style="color: #ffe664;">noticeable advantage</strong> when active. `;
                tip += `Worth positioning your skills to trigger, but don't sacrifice overall card balance. `;
                tip += `<br><br><strong>🎯 Tip:</strong> Combine with other fusions for cascading synergy effects!`;
            } else {
                tip = `Basic synergy giving you a <strong>minor but reliable boost</strong>. `;
                tip += `Triggers naturally during normal play as bonus effect. Don't rely on it, but appreciate it when it procs!`;
            }
            
            return tip;
        }
        
        // Get keyword usage in current card
        function getKeywordUsageInCard(keyword) {
            if (!currentCard) return 'No card selected.';
            
            const key = keyword.toLowerCase();
            const skills = currentCard.glyphs.filter(g => g && g.keywords?.map(k => k.toLowerCase()).includes(key));
            
            if (skills.length === 0) {
                return `No skills with <strong style="color: #ff6464;">${keyword.toUpperCase()}</strong> keyword in current card.`;
            }
            
            const count = skills.length;
            const totalPower = skills.reduce((sum, s) => sum + (s.power || 0), 0);
            
            let usage = `<strong style="color: #00e3d6;">${count} skill${count > 1 ? 's' : ''}</strong> in this card use ${keyword.toUpperCase()}, combining for <strong style="color: #ffd700;">${totalPower} total ${keyword.toUpperCase()} power</strong>. `;
            
            if (count >= 4) {
                usage += `<br><br><strong style="color: #ff8800;">🔥 MASTERY LEVEL!</strong> Extreme concentration enables devastating fusion combos and specialty builds. You're a ${keyword} specialist!`;
            } else if (count >= 3) {
                usage += `<br><br><strong style="color: #ffe664;">⚗️ High concentration</strong> creates powerful fusion potential. Look for synergy bonuses!`;
            } else if (count >= 2) {
                usage += `<br><br>Multiple uses create <strong>synergy potential</strong>. May trigger fusion effects.`;
            } else {
                usage += `<br><br>Single focused application - pure and direct effect.`;
            }
            
            return usage;
        }
        
        // Get combat tips for specific keywords
        function getKeywordCombatTips(keyword) {
            const key = keyword.toLowerCase();
            
            // Strategic combat tips for different keyword types
            const tips = {
                // Elements
                fire: 'Pairs with Lightning for chain explosions. Counter with Water or Ice. Stack Burn effects for DoT mastery.',
                ice: 'Slows enable precision strikes. Combine with Water for Blizzard effects. Vulnerable to Fire melting.',
                lightning: 'Instant burst damage. Chains between grouped enemies. Earth negates - reposition first.',
                water: 'Adaptive element. Heals + cleanses in defense. Amplifies Ice control. Douses Fire threats.',
                earth: 'Tank foundation. Blocks Lightning completely. Combine with Dark for decay synergy.',
                dark: 'Life drain sustains. Curse stacking weakens over time. Light purifies - use preemptively.',
                light: 'Purify before buffing allies. Massive damage vs cursed enemies. Counters Dark strategies.',
                
                // Mechanics
                burn: 'DoT stacks multiplicatively. Pairs with Detonate for burst. Some skills convert to Decay.',
                shield: 'Absorb before heal for efficiency. Stack before big hits. Some attacks can sunder.',
                heal: 'Time after enemy burst. Venus/Blessing enhance. Cleanse synergy increases value.',
                damage: 'Maximize with vulnerability. Burst when shields down. Chain for combos.',
                buff: 'Stack before major plays. Duration-extend with Anchor. Discord counters - cleanse first.',
                debuff: 'Layer multiple for lockdown. Consume for instant value. Cleanse is the counter.',
                
                // Advanced
                structure: 'Deploy for zone control. Amplifies Field effects. Lasts until destroyed - protect it.',
                field: 'Area denial tool. Stacks with Amplify. Structures enhance Field power.',
                invoke: 'Enhanced by Chant stacks. Primary power spike. Save for critical moments.',
                threshold: 'Build charge methodically. Collapse for AoE devastation. Track carefully.'
            };
            
            if (tips[key]) {
                return `
                    <div style="margin-top: 15px; padding: 15px; background: linear-gradient(135deg, rgba(255,136,0,0.15), rgba(255,100,100,0.15)); border-radius: 8px; border-left: 4px solid #ff8800;">
                        <strong style="color: #ff8800; font-size: 1.1em;">⚔️ Combat Strategy Tips:</strong><br>
                        <div style="margin-top: 10px; line-height: 1.7; font-size: 1.05em;">
                            ${tips[key]}
                        </div>
                    </div>
                `;
            }
            
            return ''; // No specific tips for this keyword
        }
        
        // Debug function to check database
        function debugDatabase() {
            console.log('=== DATABASE DEBUG ===');
            console.log('Total entries:', Object.keys(SKILL_DATABASE).length);
            console.log('Actual skills (÷2 for normalized names):', Object.keys(SKILL_DATABASE).length / 2);
            
            // Count by type
            const skills = Object.values(SKILL_DATABASE);
            const uniqueSkills = skills.filter((skill, index, self) => 
                index === self.findIndex(s => s.id === skill.id)
            );
            
            console.log('Unique skills:', uniqueSkills.length);
            console.log('Engines breakdown:', uniqueSkills.reduce((acc, skill) => {
                acc[skill.engine] = (acc[skill.engine] || 0) + 1;
                return acc;
            }, {}));
            
            // Test specific lookups
            console.log('\n=== Testing Lookups ===');
            console.log('Mahasiah:', SKILL_DATABASE['Mahasiah']);
            console.log('Fused Foundation Scan:', SKILL_DATABASE['Fused Foundation Scan']);
            console.log('Basic Scaffold:', SKILL_DATABASE['Basic Scaffold']);
            
            // List all skill names containing "fused"
            const fusedSkills = Object.keys(SKILL_DATABASE).filter(name => 
                name.toLowerCase().includes('fused') && !name.includes(' ')
            );
            console.log('\nFused skills found:', fusedSkills.length);
            console.log('Sample fused skills:', fusedSkills.slice(0, 10));
            
            alert(`Database loaded: ${uniqueSkills.length} unique skills\nCheck console for details`);
        }
        
        // Initialize
        async function init() {
            await buildSkillDatabase(); // Build database from loaded data-full.js + invocation + fused skills
            loadCards(); // Then load cards
        }
        
        init(); // Start initialization
        
        // Auto-refresh every 2 seconds to sync with workshop
        setInterval(() => {
            const oldCount = savedCards.length;
            loadCards();
            if (savedCards.length !== oldCount) {
                console.log('🔄 Card collection updated!');
            }
        }, 2000);
    </script>
</body>
</html>
