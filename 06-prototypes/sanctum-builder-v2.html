<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ASTRA KARMA - Sanctum Builder V2</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #e0e0e0;
            min-height: 100vh;
            overflow: hidden;
        }

        /* WebGL Background */
        #cosmicBackground {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Control Bar */
        .control-bar {
            padding: 12px 15px;
            background: linear-gradient(135deg, rgba(15, 10, 30, 0.95), rgba(25, 15, 35, 0.9));
            border-bottom: 2px solid rgba(180, 120, 255, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .chart-name-input {
            flex: 1;
            min-width: 150px;
        }

        .chart-name-input label {
            display: block;
            font-size: 10px;
            color: #b894ff;
            margin-bottom: 4px;
        }

        .chart-name-input input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(180, 120, 255, 0.1);
            border: 2px solid rgba(180, 120, 255, 0.4);
            border-radius: 5px;
            color: #d8c8ff;
            font-size: 14px;
            font-family: inherit;
        }

        .kp-budget {
            text-align: center;
        }

        .kp-label {
            font-size: 10px;
            color: #b894ff;
        }

        .kp-value {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .btn-save {
            background: linear-gradient(135deg, #2a5a2f, #4a8a4f);
            border-color: rgba(100, 200, 100, 0.6);
        }

        .btn-cancel {
            background: linear-gradient(135deg, #5a2a2a, #8a4a4a);
            border-color: rgba(200, 100, 100, 0.6);
        }

        /* Horizontal Schools Bar */
        .schools-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 15px;
            background: linear-gradient(135deg, rgba(15, 10, 30, 0.9), rgba(25, 15, 35, 0.85));
            border-bottom: 2px solid rgba(180, 120, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
        }

        .school-tab {
            padding: 10px 20px;
            min-width: 120px;
            background: rgba(180, 120, 255, 0.1);
            border: 2px solid rgba(180, 120, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .school-tab.active {
            background: linear-gradient(135deg, rgba(180, 120, 255, 0.3), rgba(200, 150, 255, 0.25));
            border-color: rgba(200, 150, 255, 0.8);
            box-shadow: 0 0 15px rgba(180, 120, 255, 0.4);
        }

        .school-tab-icon {
            font-size: 20px;
        }

        .school-tab-name {
            font-size: 12px;
            color: #d8c8ff;
            font-weight: bold;
        }

        /* Two-Panel Layout */
        .main-grid {
            display: flex;
            flex: 1;
            gap: 15px;
            padding: 15px;
            overflow: hidden;
        }
        
        /* Left Panel: Chart + Foundation */
        .left-panel {
            flex: 0 0 70%;
            background: linear-gradient(135deg, rgba(15, 10, 30, 0.9), rgba(25, 15, 35, 0.85));
            border: 2px solid rgba(180, 120, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Right Panel: Skill Tree */
        .right-panel {
            flex: 0 0 30%;
            background: linear-gradient(135deg, rgba(15, 10, 30, 0.9), rgba(25, 15, 35, 0.85));
            border: 2px solid rgba(180, 120, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .skill-tree-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(180, 120, 255, 0.3);
        }

        .skill-tree-title {
            font-size: 18px;
            color: #b894ff;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .skill-tree-subtitle {
            font-size: 11px;
            color: #c8b8d8;
        }

        .skill-card {
            background: rgba(180, 120, 255, 0.1);
            border: 2px solid rgba(180, 120, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .skill-card:hover {
            background: rgba(180, 120, 255, 0.2);
            border-color: rgba(200, 150, 255, 0.6);
            transform: translateX(5px);
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .skill-name {
            font-size: 14px;
            font-weight: bold;
            color: #d8c8ff;
        }

        .skill-cost {
            font-size: 12px;
            color: #ffd700;
        }

        .skill-stats {
            font-size: 10px;
            color: #b894ff;
            margin-bottom: 6px;
        }

        .skill-desc {
            font-size: 11px;
            color: #c8b8d8;
            line-height: 1.4;
        }

        /* Chart Display - Mobile-First Layout */
        .chart-jyotish-wrapper {
            width: 100%;
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .chart-display-area {
            width: 550px;
            height: 550px;
            position: relative;
            flex-shrink: 0;
        }

        .vedic-chart {
            width: 100%;
            height: 100%;
            position: relative;
            background: rgba(20, 10, 35, 0.9);
            border: 3px solid rgba(180, 120, 255, 0.8);
            box-shadow: 0 0 40px rgba(180, 120, 255, 0.4);
        }

        .house-slot {
            position: absolute;
            border: 2px solid rgba(180, 120, 255, 0.5);
            background: rgba(30, 20, 50, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            font-size: 9px;
            color: rgba(180, 120, 255, 0.8);
            transition: all 0.3s;
            line-height: 1.3;
        }

        .house-slot:hover {
            background: rgba(180, 120, 255, 0.2);
            border-color: rgba(200, 150, 255, 0.8);
            transform: scale(1.02);
        }
        
        .house-number {
            font-weight: bold;
            color: rgba(200, 150, 255, 1);
            font-size: 11px;
            margin-bottom: 3px;
        }
        
        .house-name {
            font-size: 10px;
            color: rgba(220, 200, 255, 0.95);
            font-weight: bold;
            margin-bottom: 2px;
        }
        
        .house-theme {
            font-size: 8px;
            color: rgba(180, 160, 220, 0.8);
            text-align: center;
            margin-bottom: 2px;
        }
        
        .house-influence {
            font-size: 7px;
            color: rgba(180, 120, 255, 0.7);
            text-align: center;
            font-style: italic;
        }

        /* House positions - Bigger corners, smaller center */
        .house-4 { width: 30%; height: 30%; top: 0; left: 0; }
        .house-3 { width: 20%; height: 30%; top: 0; left: 30%; }
        .house-2 { width: 20%; height: 30%; top: 0; left: 50%; }
        .house-1 { width: 30%; height: 30%; top: 0; right: 0; }
        .house-5 { width: 30%; height: 20%; top: 30%; left: 0; }
        .house-12 { width: 30%; height: 20%; top: 30%; right: 0; }
        .house-6 { width: 30%; height: 20%; top: 50%; left: 0; }
        .house-11 { width: 30%; height: 20%; top: 50%; right: 0; }
        .house-7 { width: 30%; height: 30%; bottom: 0; left: 0; }
        .house-8 { width: 20%; height: 30%; bottom: 0; left: 30%; }
        .house-9 { width: 20%; height: 30%; bottom: 0; left: 50%; }
        .house-10 { width: 30%; height: 30%; bottom: 0; right: 0; }

        /* Jyotish Quick Info - Beside Chart - Mobile Optimized */
        .jyotish-quick-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }
        
        .quick-info-card {
            background: linear-gradient(135deg, rgba(180, 120, 255, 0.15), rgba(200, 150, 255, 0.1));
            border: 2px solid rgba(180, 120, 255, 0.4);
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .quick-info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, rgba(180, 120, 255, 0.8), rgba(200, 150, 255, 0.6));
        }
        
        .quick-info-card:hover {
            background: linear-gradient(135deg, rgba(180, 120, 255, 0.25), rgba(200, 150, 255, 0.15));
            border-color: rgba(200, 150, 255, 0.7);
            transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(180, 120, 255, 0.3);
        }
        
        .quick-info-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .quick-info-icon {
            font-size: 18px;
            filter: drop-shadow(0 0 8px rgba(180, 120, 255, 0.6));
        }
        
        .quick-info-title {
            font-size: 11px;
            color: #b894ff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .quick-info-value {
            font-size: 16px;
            color: #e8d8ff;
            font-weight: bold;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(180, 120, 255, 0.4);
        }
        
        .quick-info-desc {
            font-size: 10px;
            color: #c8b8d8;
            line-height: 1.4;
        }

        /* Jyotish Foundation - Mobile-First Grid Below Chart */
        .jyotish-foundation {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 12px;
        }
        
        .foundation-section {
            background: linear-gradient(135deg, rgba(180, 120, 255, 0.12), rgba(200, 150, 255, 0.08));
            border: 2px solid rgba(180, 120, 255, 0.35);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .foundation-section:hover {
            border-color: rgba(200, 150, 255, 0.6);
            box-shadow: 0 6px 20px rgba(180, 120, 255, 0.25);
            transform: translateY(-2px);
        }
        
        .section-header {
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(180, 120, 255, 0.2), rgba(200, 150, 255, 0.15));
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .section-header:active {
            transform: scale(0.98);
        }
        
        .section-header:hover {
            background: linear-gradient(135deg, rgba(180, 120, 255, 0.3), rgba(200, 150, 255, 0.2));
        }
        
        .section-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-icon {
            font-size: 20px;
            filter: drop-shadow(0 0 8px rgba(180, 120, 255, 0.6));
        }
        
        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: #e8d8ff;
            text-shadow: 0 0 10px rgba(180, 120, 255, 0.4);
        }
        
        .section-arrow {
            font-size: 14px;
            color: #b894ff;
            transition: transform 0.3s ease;
        }
        
        .section-arrow.open {
            transform: rotate(90deg);
        }
        
        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .section-content.open {
            max-height: 800px;
            padding: 14px 16px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: rgba(180, 120, 255, 0.08);
            border-radius: 6px;
            border-left: 3px solid rgba(180, 120, 255, 0.4);
            transition: all 0.2s ease;
        }
        
        .info-row:hover {
            background: rgba(180, 120, 255, 0.15);
            border-left-color: rgba(200, 150, 255, 0.8);
            transform: translateX(4px);
        }
        
        .info-row:last-child {
            margin-bottom: 0;
        }
        
        .info-label {
            font-size: 11px;
            color: #b894ff;
            font-weight: 500;
        }
        
        .info-value {
            font-size: 11px;
            color: #e8d8ff;
            font-weight: bold;
        }
        
        .planet-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin-bottom: 4px;
            background: rgba(180, 120, 255, 0.06);
            border-radius: 6px;
            border: 1px solid rgba(180, 120, 255, 0.2);
            transition: all 0.2s ease;
        }
        
        .planet-row:hover {
            background: rgba(180, 120, 255, 0.12);
            border-color: rgba(200, 150, 255, 0.5);
        }
        
        .planet-icon {
            font-size: 16px;
            min-width: 24px;
            text-align: center;
        }
        
        .planet-name {
            flex: 1;
            font-size: 11px;
            color: #d8c8ff;
            font-weight: 500;
        }
        
        .planet-status {
            font-size: 10px;
            color: #b894ff;
            font-style: italic;
        }
    </style>
</head>
<body>
    <canvas id="cosmicBackground"></canvas>

    <div class="content-wrapper">
        <!-- Top Control Bar -->
        <div class="control-bar">
            <div class="chart-name-input">
                <label>Chart Name</label>
                <input type="text" value="Warrior's Path">
            </div>
            <div class="kp-budget">
                <div class="kp-label">KP Budget</div>
                <div class="kp-value"><span>8</span> / <span>100</span></div>
            </div>
            <button onclick="window.location.href='../05-fusion/demo/index.html'" style="padding:8px 14px; background:rgba(139,92,246,0.2); color:#b894ff; border:2px solid rgba(139,92,246,0.5); border-radius:5px; cursor:pointer; font-size:13px; font-family:inherit">
                ← Fusion System
            </button>
            <div>
                <button class="btn btn-save">💾</button>
                <button class="btn btn-cancel">✖</button>
            </div>
        </div>

        <!-- Horizontal Schools Bar -->
        <div class="schools-bar" id="schoolsBar"></div>

        <!-- Two-Panel Layout -->
        <div class="main-grid">
            <!-- LEFT: Chart + Foundation -->
            <div class="left-panel">
                <!-- Chart with Quick Info Beside -->
                <div class="chart-jyotish-wrapper">
                    <div class="chart-display-area">
                        <div class="vedic-chart" id="vedicChart"></div>
                    </div>
                    <div class="jyotish-quick-info" id="quickInfo"></div>
                </div>
                
                <!-- Full Foundation Below Chart -->
                <div class="jyotish-foundation" id="jyotishFoundation"></div>
            </div>

            <!-- RIGHT: Skill Tree -->
            <div class="right-panel">
                <div class="skill-tree-header">
                    <div class="skill-tree-title" id="skillTreeTitle">🔥 Tantra School</div>
                    <div class="skill-tree-subtitle" id="skillTreeSubtitle">Select abilities for your chart</div>
                </div>
                <div id="skillTreeContent"></div>
            </div>
        </div>
    </div>

    <script>
        // WebGL Background
        let scene, camera, renderer;
        
        function initCosmicBackground() {
            const canvas = document.getElementById('cosmicBackground');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 2,
                transparent: true,
                opacity: 0.8
            });
            
            const starVertices = [];
            for (let i = 0; i < 1000; i++) {
                starVertices.push(
                    (Math.random() - 0.5) * 2000,
                    (Math.random() - 0.5) * 2000,
                    -Math.random() * 2000
                );
            }
            
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const starField = new THREE.Points(starGeometry, starMaterial);
            scene.add(starField);
            
            camera.position.z = 1;
            
            function animate() {
                requestAnimationFrame(animate);
                starField.rotation.x += 0.0001;
                starField.rotation.y += 0.0002;
                renderer.render(scene, camera);
            }
            animate();
        }

        window.addEventListener('resize', () => {
            if (renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Schools
        const SCHOOLS = [
            { id: 'tantra', name: 'Tantra', icon: '🔥' },
            { id: 'consciousness', name: 'Consciousness', icon: '🧠' },
            { id: 'therapeutic', name: 'Therapeutic', icon: '🛡️' },
            { id: 'character', name: 'Character', icon: '🎭' },
            { id: 'divination', name: 'Divination', icon: '🔮' },
            { id: 'foundational', name: 'Foundational', icon: '📚' },
            { id: 'invocation', name: 'Invocation', icon: '🌟' },
            { id: 'singularity', name: 'Singularity', icon: '∞' }
        ];

        let currentSchool = 'tantra';

        function renderSchools() {
            document.getElementById('schoolsBar').innerHTML = SCHOOLS.map(s => `
                <div class="school-tab ${s.id === currentSchool ? 'active' : ''}" 
                     data-school="${s.id}"
                     onclick="selectSchool('${s.id}')">
                    <span class="school-tab-icon">${s.icon}</span>
                    <span class="school-tab-name">${s.name}</span>
                </div>
            `).join('');
        }

        function selectSchool(schoolId) {
            currentSchool = schoolId;
            renderSchools();
            renderSkillTree(schoolId);
            const school = SCHOOLS.find(s => s.id === schoolId);
            const skillCount = getSkillsForSchool(schoolId).length;
            document.getElementById('skillTreeTitle').textContent = `${school.icon} ${school.name} School`;
            
            // Update subtitle with skill count
            if (window.SkillSystem) {
                const stats = SkillSystem.getStats();
                document.getElementById('skillTreeSubtitle').textContent = `${skillCount} skills available • ${stats.total} total in system`;
            } else {
                document.getElementById('skillTreeSubtitle').textContent = `${skillCount} skills available`;
            }
        }

        function renderSkillTree(schoolId) {
            const skills = getSkillsForSchool(schoolId);
            document.getElementById('skillTreeContent').innerHTML = skills.map(skill => `
                <div class="skill-card">
                    <div class="skill-header">
                        <div class="skill-name">${skill.name}${skill.isFused ? ' ✨' : ''}</div>
                        <div class="skill-cost">${skill.kp} KP</div>
                    </div>
                    <div class="skill-stats">⚡${skill.prana} Prana • 🕐${skill.cooldown} CD</div>
                    <div class="skill-desc">${skill.desc}</div>
                </div>
            `).join('');
        }

        // Jyotish house data from engine
        const jyotishHouses = [
            { number: 1, name: 'Self', theme: 'Identity, Body', influence: 'Defensive +10%', roman: 'I' },
            { number: 2, name: 'Wealth', theme: 'Resources, Speech', influence: 'Resources +10%', roman: 'II' },
            { number: 3, name: 'Courage', theme: 'Communication', influence: 'Debuff +1 turn', roman: 'III' },
            { number: 4, name: 'Home', theme: 'Emotions, Foundation', influence: 'Healing +10%', roman: 'IV' },
            { number: 5, name: 'Creativity', theme: 'Intellect, Joy', influence: 'Buff +1 turn', roman: 'V' },
            { number: 6, name: 'Service', theme: 'Conflict, Health', influence: 'DoT +10%', roman: 'VI' },
            { number: 7, name: 'Partner', theme: 'Others, Balance', influence: 'Control harder to resist', roman: 'VII' },
            { number: 8, name: 'Transform', theme: 'Secrets, Death', influence: 'Ultimate -1 Prana', roman: 'VIII' },
            { number: 9, name: 'Wisdom', theme: 'Fortune, Learning', influence: 'Aura range +10%', roman: 'IX' },
            { number: 10, name: 'Career', theme: 'Status, Achievement', influence: 'Yantra +10% Ojas', roman: 'X' },
            { number: 11, name: 'Gains', theme: 'Community, Goals', influence: 'Board abilities +5%', roman: 'XI' },
            { number: 12, name: 'Loss', theme: 'Liberation, Sacrifice', influence: 'Sacrifice +20%', roman: 'XII' }
        ];

        // Generate Houses with Real Jyotish Data
        function generateHouses() {
            const chart = document.getElementById('vedicChart');
            
            for (let i = 1; i <= 12; i++) {
                const houseData = jyotishHouses[i - 1];
                const house = document.createElement('div');
                house.className = `house-slot house-${i}`;
                house.innerHTML = `
                    <div class="house-number">${houseData.roman}</div>
                    <div class="house-name">${houseData.name}</div>
                    <div class="house-theme">${houseData.theme}</div>
                    <div class="house-influence">${houseData.influence}</div>
                `;
                chart.appendChild(house);
            }
        }

        // Generate Quick Info Beside Chart - Mobile Optimized
        function renderQuickInfo() {
            document.getElementById('quickInfo').innerHTML = `
                <div class="quick-info-card">
                    <div class="quick-info-header">

    <script>
        // Load skills from SkillSystem
        function getSkillsForSchool(schoolId) {
            if (window.SkillSystem) {
                const allSkills = SkillSystem.getAllSkills();
                const filteredSkills = allSkills.filter(s => s.school === schoolId);
                
                if (filteredSkills.length > 0) {
                    return filteredSkills.map(s => ({
                        name: s.name,
                        kp: s.cost || 8,
                        prana: s.prana || 3,
                        cooldown: s.cooldown || 1,
                        desc: s.effect || s.description || 'No description',
                        isFused: s.isFused || false
                    }));
                }
            }
            
            // Fallback to hardcoded data
            const skillData = {
                tantra: [
                    { name: 'Astral Lance', kp: 8, prana: 3, cooldown: 1, desc: 'Deal 15 damage. Apply 1 [Decay].' },
                    { name: 'Pranic Nova', kp: 12, prana: 5, cooldown: 3, desc: 'Consume [Decay] on target. Deal AoE damage.' },
                    { name: 'Kundalini Surge', kp: 15, prana: 7, cooldown: 4, desc: 'Ultimate: Deal massive damage to all enemies.' }
                ],
                consciousness: [
                    { name: 'Alpha State', kp: 8, prana: 1, cooldown: 2, desc: 'Enter Alpha for 2 turns: +1 Prana gen.' },
                    { name: 'Theta Vision', kp: 10, prana: 3, cooldown: 3, desc: 'Reveal enemy hand and cooldowns.' },
                    { name: 'Delta Trance', kp: 14, prana: 5, cooldown: 4, desc: 'Enter deep meditation: immune to debuffs.' }
                ],
                therapeutic: [
                    { name: 'Cellular Renewal', kp: 8, prana: 2, cooldown: 1, desc: 'Restore 12 Ojas. +3% Integrity.' },
                    { name: 'Marma Therapy', kp: 11, prana: 4, cooldown: 2, desc: 'Heal target and cleanse 2 debuffs.' },
                    { name: 'Prana Infusion', kp: 15, prana: 6, cooldown: 3, desc: 'Massive heal + grant shield.' }
                ]
            };
            
            return skillData[schoolId] || [
                { name: 'Coming Soon', kp: 0, prana: 0, cooldown: 0, desc: 'Skills for this school are being developed.' }
            ];
        }
        
        // Log SkillSystem status on load
        if (window.SkillSystem) {
            console.log('🔗 SkillSystem loaded:', SkillSystem.getStats());
        } else {
            console.warn('⚠️ SkillSystem not found - using fallback data');
        }
