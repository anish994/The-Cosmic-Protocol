<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA KARMA - Architect's Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #000000 70%, #0d0006 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* Animated Kashi background */
        .background-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(to bottom, transparent 60%, rgba(10, 10, 26, 0.8) 100%),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%23050510" width="1200" height="600"/><path d="M0 400 Q300 350 600 380 T1200 400 V600 H0 Z" fill="%231a1a2e" opacity="0.6"/><circle cx="200" cy="100" r="3" fill="%23ffb86c" opacity="0.3"/><circle cx="800" cy="150" r="2" fill="%23ffd700" opacity="0.4"/><circle cx="500" cy="80" r="2" fill="%23ff79c6" opacity="0.3"/></svg>');
            background-size: cover;
            background-position: center bottom;
            opacity: 0.5;
            z-index: 0;
        }

        /* Flowing Ganga river animation */
        .river-flow {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(90deg,
                rgba(100, 120, 180, 0.1) 0%,
                rgba(120, 140, 200, 0.15) 50%,
                rgba(100, 120, 180, 0.1) 100%);
            animation: riverFlow 20s linear infinite;
            opacity: 0.3;
        }

        @keyframes riverFlow {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Main container */
        .console-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 200px 1fr;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .console-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                padding: 10px;
                gap: 10px;
            }
        }

        /* Top Status Bar */
        .top-bar {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: linear-gradient(135deg, 
                rgba(15, 10, 30, 0.9) 0%, 
                rgba(25, 15, 35, 0.85) 100%);
            border: 2px solid rgba(180, 120, 255, 0.4);
            border-radius: 10px;
            box-shadow: 
                0 0 30px rgba(150, 100, 200, 0.3),
                inset 0 0 20px rgba(80, 40, 120, 0.2);
            gap: 15px;
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                padding: 10px 15px;
            }
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-name {
            font-size: 18px;
            font-weight: bold;
            color: #d8c8ff;
            text-shadow: 0 0 10px rgba(180, 120, 255, 0.6);
        }

        .player-level {
            font-size: 14px;
            color: #b894ff;
            padding: 4px 12px;
            background: rgba(180, 120, 255, 0.2);
            border-radius: 12px;
            border: 1px solid rgba(180, 120, 255, 0.4);
        }

        .resources {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .resources {
                gap: 15px;
                justify-content: center;
            }
        }

        .resource {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .resource-icon {
            font-size: 18px;
        }

        .resource-value {
            color: #ffd700;
            font-weight: bold;
        }

        /* Center: Holographic Chart Display */
        .center-display {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            min-height: 400px;
        }

        @media (max-width: 768px) {
            .center-display {
                grid-column: 1;
                grid-row: 3;
                padding: 10px;
            }
        }

        .chart-hologram {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 1;
            animation: subtleFloat 8s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .chart-hologram {
                max-width: 350px;
            }
        }

        @media (max-width: 480px) {
            .chart-hologram {
                max-width: 280px;
            }
        }

        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .chart-display {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            transition: all 0.4s ease;
            transform-style: preserve-3d;
        }

        .chart-display:hover {
            transform: scale(1.02) translateY(-5px);
        }

        /* North Indian Vedic Chart - Diamond Square Layout */
        .vedic-chart {
            position: absolute;
            width: 70%;
            height: 70%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            border: 3px solid rgba(180, 120, 255, 0.8);
            background: linear-gradient(135deg,
                rgba(20, 10, 35, 0.95) 0%,
                rgba(30, 15, 45, 0.9) 50%,
                rgba(25, 12, 40, 0.95) 100%);
            box-shadow: 
                0 0 60px rgba(180, 120, 255, 0.5),
                inset 0 0 50px rgba(100, 50, 150, 0.3),
                0 0 100px rgba(150, 100, 200, 0.3);
            position: relative;
        }

        /* Ornate corner decorations */
        .vedic-chart::before,
        .vedic-chart::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(200, 150, 255, 0.6);
        }

        .vedic-chart::before {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
        }

        .vedic-chart::after {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
        }

        /* 12 House divisions (North Indian style) */
        .house-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Cross dividers */
        .house-divider {
            position: absolute;
            background: linear-gradient(to right,
                transparent,
                rgba(180, 120, 255, 0.6) 30%,
                rgba(200, 150, 255, 0.8) 50%,
                rgba(180, 120, 255, 0.6) 70%,
                transparent);
            box-shadow: 0 0 15px rgba(180, 120, 255, 0.6);
        }

        .divider-h {
            width: 100%;
            height: 2px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        .divider-v {
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }

        /* Diagonal dividers */
        .divider-diag1,
        .divider-diag2 {
            position: absolute;
            width: 141%;
            height: 2px;
            top: 50%;
            left: 50%;
            background: linear-gradient(to right,
                transparent,
                rgba(180, 120, 255, 0.4) 40%,
                rgba(200, 150, 255, 0.6) 50%,
                rgba(180, 120, 255, 0.4) 60%,
                transparent);
            box-shadow: 0 0 10px rgba(180, 120, 255, 0.4);
        }

        .divider-diag1 {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .divider-diag2 {
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        /* Sacred symbols at cardinal points */
        .cardinal-symbols {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform: rotate(-45deg);
        }

        .cardinal-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle,
                rgba(255, 255, 255, 0.9) 0%,
                rgba(200, 150, 255, 0.8) 50%,
                transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(200, 150, 255, 0.8);
            animation: dotPulse 3s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        .dot-top { top: -4px; left: 50%; transform: translateX(-50%); }
        .dot-right { right: -4px; top: 50%; transform: translateY(-50%); }
        .dot-bottom { bottom: -4px; left: 50%; transform: translateX(-50%); }
        .dot-left { left: -4px; top: 50%; transform: translateY(-50%); }

        /* Outer glow ring */
        .outer-ring {
            position: absolute;
            width: 85%;
            height: 85%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            border: 1px solid rgba(180, 120, 255, 0.3);
            box-shadow: 
                0 0 30px rgba(180, 120, 255, 0.3),
                inset 0 0 30px rgba(150, 100, 200, 0.2);
            animation: ringRotate 30s linear infinite;
        }

        @keyframes ringRotate {
            from { transform: translate(-50%, -50%) rotate(45deg); }
            to { transform: translate(-50%, -50%) rotate(405deg); }
        }

        /* Chart title and info */
        .chart-info-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .chart-name {
            font-size: clamp(20px, 5vw, 28px);
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(135deg,
                #d8c8ff 0%,
                #f0e8ff 50%,
                #d8c8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(200, 150, 255, 0.8);
            margin-bottom: 8px;
            filter: drop-shadow(0 0 20px rgba(180, 120, 255, 0.6));
        }

        .chart-ascendant {
            font-size: clamp(12px, 3vw, 14px);
            color: #b894ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(180, 120, 255, 0.5);
        }

        /* House number labels */
        .house-label {
            position: absolute;
            font-size: 10px;
            color: rgba(180, 120, 255, 0.6);
            font-weight: bold;
            pointer-events: none;
        }

        .chart-edit-btn {
            margin-top: 30px;
            padding: 12px 40px;
            background: linear-gradient(135deg, #4a2a6f, #6a4a9f);
            color: #f0e8ff;
            border: 2px solid rgba(180, 120, 255, 0.6);
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(150, 100, 200, 0.4);
        }

        .chart-edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(180, 120, 255, 0.6);
        }

        /* Left Navigation Dock */
        .left-nav {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            background: linear-gradient(135deg,
                rgba(15, 10, 30, 0.8),
                rgba(25, 15, 35, 0.75));
            border: 2px solid rgba(180, 120, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(150, 100, 200, 0.2);
            height: fit-content;
        }

        @media (max-width: 768px) {
            .left-nav {
                grid-column: 1;
                grid-row: 2;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                padding: 10px;
            }
        }

        .nav-button {
            padding: 12px 15px;
            background: rgba(180, 120, 255, 0.1);
            border: 2px solid rgba(180, 120, 255, 0.4);
            border-radius: 8px;
            color: #c8b8d8;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .nav-button {
                padding: 10px 15px;
                font-size: 12px;
                flex: 1 1 auto;
                min-width: 120px;
            }
        }

        .nav-button:hover {
            background: rgba(180, 120, 255, 0.2);
            border-color: rgba(200, 150, 255, 0.6);
            color: #d8c8ff;
            box-shadow: 0 0 20px rgba(180, 120, 255, 0.4);
            transform: translateX(5px);
        }

        .nav-button.active {
            background: rgba(180, 120, 255, 0.3);
            border-color: rgba(200, 150, 255, 0.8);
            color: #f0e8ff;
        }

        .nav-icon {
            font-size: 20px;
            margin-right: 10px;
        }

        /* Bottom Right: Action Buttons */
        .action-buttons {
            grid-column: 2;
            grid-row: 3;
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 15px;
            padding: 0 20px 20px;
        }

        @media (max-width: 768px) {
            .action-buttons {
                grid-column: 1;
                grid-row: 4;
                justify-content: center;
                padding: 0 10px 15px;
            }
        }

        .action-btn {
            padding: 18px 45px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 3px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 30px;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .action-btn {
                padding: 15px 35px;
                font-size: 14px;
                flex: 1 1 auto;
            }
        }

        @media (max-width: 480px) {
            .action-btn {
                padding: 12px 25px;
                font-size: 13px;
                width: 100%;
            }
        }

        .missions-btn {
            background: linear-gradient(135deg, #1a3a6f, #2a5a9f);
            border-color: rgba(100, 150, 255, 0.6);
            color: #e0f0ff;
            box-shadow: 0 5px 30px rgba(100, 150, 255, 0.4);
        }

        .missions-btn:hover {
            box-shadow: 0 8px 40px rgba(100, 150, 255, 0.7);
            transform: translateY(-3px);
        }

        .arena-btn {
            background: linear-gradient(135deg, #6f4a1a, #9f7a2a);
            border-color: rgba(255, 200, 100, 0.6);
            color: #fff8e0;
            box-shadow: 0 5px 30px rgba(255, 200, 100, 0.4);
        }

        .arena-btn:hover {
            box-shadow: 0 8px 40px rgba(255, 200, 100, 0.7);
            transform: translateY(-3px);
        }

        /* Pulsing glow effect */
        @keyframes actionPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .missions-btn::before {
            content: '⚡';
            position: absolute;
            left: 15px;
            animation: actionPulse 2s ease-in-out infinite;
        }

        .arena-btn::before {
            content: '⚔️';
            position: absolute;
            left: 15px;
            animation: actionPulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="background-scene"></div>
    <div class="river-flow"></div>

    <!-- Main Console -->
    <div class="console-container">
        <!-- Top Status Bar -->
        <div class="top-bar">
            <div class="player-info">
                <div class="player-name">Architect Anish</div>
                <div class="player-level">Level 1</div>
            </div>
            <div class="resources">
                <div class="resource">
                    <span class="resource-icon">✨</span>
                    <span>Gnosis:</span>
                    <span class="resource-value">250</span>
                </div>
                <div class="resource">
                    <span class="resource-icon">⚡</span>
                    <span>KP:</span>
                    <span class="resource-value">100</span>
                </div>
                <div class="resource">
                    <span class="resource-icon">💎</span>
                    <span>Shards:</span>
                    <span class="resource-value">50</span>
                </div>
            </div>
        </div>

        <!-- Left Navigation -->
        <div class="left-nav">
            <button class="nav-button active">
                <span class="nav-icon">🏛️</span>
                Sanctum
            </button>
            <button class="nav-button">
                <span class="nav-icon">📚</span>
                Grand Library
            </button>
            <button class="nav-button">
                <span class="nav-icon">📜</span>
                Archive
            </button>
            <button class="nav-button">
                <span class="nav-icon">👤</span>
                Profile
            </button>
            <button class="nav-button">
                <span class="nav-icon">📧</span>
                Inbox
            </button>
        </div>

        <!-- Center: Holographic Chart -->
        <div class="center-display">
            <div class="chart-hologram">
                <div class="chart-display" onclick="editChart()">
                    <!-- Outer rotating ring -->
                    <div class="outer-ring"></div>
                    
                    <!-- North Indian Vedic Chart -->
                    <div class="vedic-chart">
                        <div class="house-grid">
                            <!-- Main cross dividers -->
                            <div class="house-divider divider-h"></div>
                            <div class="house-divider divider-v"></div>
                            <!-- Diagonal dividers -->
                            <div class="divider-diag1"></div>
                            <div class="divider-diag2"></div>
                        </div>
                        
                        <!-- Cardinal direction dots -->
                        <div class="cardinal-symbols">
                            <div class="cardinal-dot dot-top"></div>
                            <div class="cardinal-dot dot-right"></div>
                            <div class="cardinal-dot dot-bottom"></div>
                            <div class="cardinal-dot dot-left"></div>
                        </div>
                    </div>
                    
                    <!-- Chart info overlay -->
                    <div class="chart-info-overlay">
                        <div class="chart-name">Solar Warrior</div>
                        <div class="chart-ascendant">⟡ Aries ⟡</div>
                    </div>
                </div>
            </div>
            <button class="chart-edit-btn" onclick="editChart()">Edit Chart</button>
        </div>

        <!-- Bottom Action Buttons -->
        <div class="action-buttons">
            <button class="action-btn missions-btn" onclick="startMissions()">
                Missions
            </button>
            <button class="action-btn arena-btn" onclick="enterArena()">
                Arena
            </button>
        </div>
    </div>

    <script>
        // Navigation handlers
        document.querySelectorAll('.nav-button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                console.log('Navigate to:', this.textContent.trim());
            });
        });

        function editChart() {
            console.log('🏛️ Opening Sanctum (Chart Builder)...');
            alert('Next: The Sanctum (Chart Builder)\n\nThis will be the next screen we prototype!');
        }

        function startMissions() {
            console.log('⚡ Starting Missions...');
            alert('💡 Mission Mode: Offline progression\n\nWhere you battle AI opponents for Gnosis and KP!');
        }

        function enterArena() {
            console.log('⚔️ Entering Arena...');
            alert('💡 Arena Mode: Online PvP battles\n\nTest your charts against other Architects!');
        }

        // Subtle glow pulse effect
        setInterval(() => {
            const vedic = document.querySelector('.vedic-chart');
            if (vedic) {
                vedic.style.filter = `brightness(${1 + Math.sin(Date.now() / 1000) * 0.1})`;
            }
        }, 50);
    </script>
</body>
</html>
